    <div class="field"><label>Dias da semana</label>${daySelector('a-days', a?a.days:[0,1,2,3,4,5,6])}</div>
    <button class="btn btn-primary" onclick="saveActivity(${id||'null'})">Salvar</button>
  `);
}
async function saveActivity(id){
  const rec = { name:document.getElementById('a-name').value.trim(), goal:document.getElementById('a-goal').value.trim(),
    time:document.getElementById('a-time').value, weight:+document.getElementById('a-weight').value,
    days:readDaySelector('a-days'), active:true };
  if(id) rec.id=id;
  const newId = await dbPut('activities',rec); rec.id=id||newId;
  const idx = S.activities.findIndex(x=>x.id===rec.id);
  if(idx>-1) S.activities[idx]=rec; else S.activities.push(rec);
  closeModal(); goTo(S.view);
}
async function deleteActivity(id){
  await dbDelete('activities',id); S.activities=S.activities.filter(a=>a.id!==id);
  goTo(S.view);
}

function multiSelectChips(fieldId, items, selectedIds, labelFn){
  if(!items.length) return `<div class="sub">Nenhuma cadastrada ainda.</div>`;
  return `<div class="chip-row" id="${fieldId}">${items.map(it=>`<button type="button" class="chip ${selectedIds.includes(it.id)?'selected':''}" onclick="this.classList.toggle('selected')" data-id="${it.id}">${escapeHtml(labelFn(it))}</button>`).join('')}</div>`;
}
function readMultiSelectChips(fieldId){
  return [...document.querySelectorAll(`#${fieldId} .chip.selected`)].map(c=>+c.dataset.id);
}
function metaLogsListHtml(p){
  const isW = p.metricMode==='weight';
  const logsLabel = p.metricKind==='sum' ? 'Lançamentos por dia (somados)' : 'Medições registradas';
  const logs = isW
    ? S.weightLogs.filter(w=>w.date>=p.startDate && w.date<=p.endDate).map(w=>({date:w.date,value:w.kg}))
    : (p.metricLogs||[]).map(l=>({date:l.date,value:+l.value}));
  logs.sort((a,b)=>b.date.localeCompare(a.date));
  if(!logs.length) return '<div class="sub" style="margin-bottom:10px;">Nenhuma medição registrada ainda.</div>';
  const unit = isW ? ' kg' : (p.metricUnit ? ' '+escapeHtml(p.metricUnit) : '');
  return `<div class="sub" style="margin:4px 0 6px;">${logsLabel}${isW?' (vêm do Corpo)':''}</div>
    <div id="p-m-list" style="max-height:160px;overflow:auto;margin-bottom:10px;">` + logs.slice(0,30).map(l=>`
      <div class="list-row" id="mlog-${l.date}"><div class="name">${fmtDatePretty(l.date)}</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-family:var(--font-mono);font-weight:600;">${fmtNum(l.value)}${unit}</span>
          ${isW?'':`<button class="btn btn-ghost btn-sm" onclick="deleteMetaLog(${p.id},'${l.date}')">✕</button>`}
        </div></div>`).join('') + '</div>';
}
async function deleteMetaLog(id,date){
  const p = S.projects.find(x=>x.id===id); if(!p) return;
  p.metricLogs = (p.metricLogs||[]).filter(l=>l.date!==date);
  await dbPut('projects', p);
  const el = document.getElementById('mlog-'+date); if(el) el.remove();
  toast('Medição removida.');
}
function openProjectForm(id){
  const p = id ? S.projects.find(x=>x.id===id) : null;
  const horizon = p ? getHorizon(p) : 'curta';
  const metricMode = p?.metricMode || 'none';
  const w = latestWeight();
  openModal(`
    <h2>${p?'Editar meta':'Nova meta'}</h2>
    <div class="field"><label>Nome da meta</label><input id="p-name" value="${p?p.name:''}" placeholder="Ex: Emagrecer 5 kg"></div>
    <div class="field"><label>Objetivo da meta</label><input id="p-obj" value="${p?p.objective||'':''}" placeholder="O que você quer alcançar com esta meta"></div>
    <div class="field"><label>Descrição (opcional)</label><textarea id="p-desc">${p?p.description||'':''}</textarea></div>
    <div class="field"><label>Prazo</label>
      <select id="p-horizon">
        <option value="curta" ${horizon==='curta'?'selected':''}>Curto prazo (até ~30 dias)</option>
        <option value="media" ${horizon==='media'?'selected':''}>Médio prazo (1–3 meses)</option>
        <option value="longa" ${horizon==='longa'?'selected':''}>Longo prazo (3+ meses)</option>
      </select>
    </div>
    <div class="field-row">
      <div class="field"><label>Data de início</label><input type="date" id="p-start" value="${p?p.startDate:todayStr()}"></div>
      <div class="field"><label>Data de término</label><input type="date" id="p-end" value="${p?p.endDate:addDays(todayStr(),29)}"></div>
    </div>

    <div class="field"><label>Acompanhamento numérico (projeção preditiva)</label>
      <select id="p-metric-mode" onchange="toggleMetaMetricFields()">
        <option value="none" ${metricMode==='none'?'selected':''}>Nenhum — só atividades / índice</option>
        <option value="weight" ${metricMode==='weight'?'selected':''}>Peso (kg) — lê automaticamente do Corpo</option>
        <option value="numeric" ${metricMode==='numeric'?'selected':''}>Número personalizado</option>
      </select>
    </div>
    <div id="p-metric-fields" style="${metricMode==='none'?'display:none':''}">
      <div class="field-row">
        <div class="field"><label>Valor inicial</label><input type="text" inputmode="decimal" id="p-metric-start" value="${p&&p.metricStart!=null?fmtNum(p.metricStart):(metricMode==='weight'&&w!=null?fmtNum(w):'')}" placeholder="Ex: 100"></div>
        <div class="field"><label>Valor meta</label><input type="text" inputmode="decimal" id="p-metric-target" value="${p&&p.metricTarget!=null?fmtNum(p.metricTarget):''}" placeholder="Ex: 95"></div>
      </div>
      <div class="field" id="p-metric-kind-wrap" style="${metricMode==='numeric'?'':'display:none'}"><label>Como registrar</label>
        <select id="p-metric-kind">
          <option value="level" ${p?.metricKind!=='sum'?'selected':''}>Valor medido — o último valor vale (ex.: nota, páginas lidas)</option>
          <option value="sum" ${p?.metricKind==='sum'?'selected':''}>Acumulado — cada lançamento soma (ex.: juntar dinheiro)</option>
        </select>
      </div>
      <div class="field" id="p-metric-unit-wrap" style="${metricMode==='weight'?'display:none':''}"><label>Unidade</label><input id="p-metric-unit" value="${p?escapeHtml(p.metricUnit||''):''}" placeholder="Ex: kg, páginas, km"></div>
      <div class="sub" style="margin-bottom:10px;">Com peso, as medições vêm do histórico do Corpo. A projeção usa regressão linear e ignora dias sem registro.</div>
      <div class="field" style="margin-bottom:6px;"><label>Registrar medição (alimenta a projeção)</label></div>
      <div class="field-row">
        <div class="field"><label>Data</label><input type="date" id="p-m-date" value="${todayStr()}" max="${todayStr()}"></div>
        <div class="field"><label>Valor</label><input type="text" inputmode="decimal" id="p-m-val" placeholder="Ex: 98,5"></div>
      </div>
      <div class="sub" style="margin-bottom:10px;">Preencha e toque em Salvar. Em meta acumulada, o valor é somado ao total do dia. Para lançar outro dia, edite a meta novamente.</div>
      ${p ? metaLogsListHtml(p) : ''}
    </div>

    <div class="field">
      <label>Atividades vinculadas (opcional)</label>
      ${multiSelectChips('p-acts', S.activities, p?.linkedActivityIds||[], a=>a.name)}
    </div>
    <div class="field">
      <label>Horários da rotina vinculados (opcional)</label>
      ${multiSelectChips('p-routines', S.routineItems, p?.linkedRoutineIds||[], r=>`${r.time} ${r.label}`)}
    </div>
    <div class="sub" style="margin-bottom:14px;">Se houver acompanhamento numérico, a previsão RAG usa a projeção. Caso contrário, usa atividades vinculadas ou o índice de evolução.</div>
    <button class="btn btn-primary" onclick="saveProject(${id||'null'})">Salvar</button>
  `);
}
function toggleMetaMetricFields(){
  const mode = document.getElementById('p-metric-mode').value;
  const box = document.getElementById('p-metric-fields');
  const unitWrap = document.getElementById('p-metric-unit-wrap');
  if(box) box.style.display = mode==='none' ? 'none' : '';
  if(unitWrap) unitWrap.style.display = mode==='weight' ? 'none' : '';
  const kw = document.getElementById('p-metric-kind-wrap'); if(kw) kw.style.display = mode==='numeric' ? '' : 'none';
  if(mode==='weight'){
    const startEl = document.getElementById('p-metric-start');
    if(startEl && !startEl.value){ const w = latestWeight(); if(w!=null) startEl.value = fmtNum(w); }
  }
}
async function saveProject(id){
  const metricMode = document.getElementById('p-metric-mode').value;
  let metricStart = null, metricTarget = null, metricUnit = '';
  if(metricMode!=='none'){
    metricStart = parseNum(document.getElementById('p-metric-start').value);
    metricTarget = parseNum(document.getElementById('p-metric-target').value);
    if(isNaN(metricStart) || isNaN(metricTarget)){ toast('Informe valor inicial e valor meta válidos.'); return; }
    metricUnit = metricMode==='weight' ? 'kg' : (document.getElementById('p-metric-unit').value.trim() || '');
  }
  let newMeasure = null;
  if(metricMode!=='none'){
    const mvRaw = (document.getElementById('p-m-val')||{}).value || '';
    if(mvRaw.trim()!==''){
      const mv = parseNum(mvRaw);
      const md = (document.getElementById('p-m-date')||{}).value || todayStr();
      if(isNaN(mv) || (metricMode==='weight' && (mv<=0 || mv>400))){ toast('Informe um valor de medição válido.'); return; }
      newMeasure = {date:md, value:mv};
    }
  }
  const existing = id ? S.projects.find(x=>x.id===id) : null;
  const rec = { name:document.getElementById('p-name').value.trim(), objective:document.getElementById('p-obj').value.trim(),
    description:document.getElementById('p-desc').value.trim(), startDate:document.getElementById('p-start').value,
    endDate:document.getElementById('p-end').value, horizon:document.getElementById('p-horizon').value, archived:false,
    metricMode, metricStart, metricTarget, metricUnit,
    metricKind: metricMode==='numeric' ? (document.getElementById('p-metric-kind').value||'level') : 'level',
    metricLogs: existing?.metricLogs || [],
    mitigationPlan: existing?.mitigationPlan || '', contingencyPlan: existing?.contingencyPlan || '',
    linkedActivityIds: readMultiSelectChips('p-acts'), linkedRoutineIds: readMultiSelectChips('p-routines') };
  if(id) rec.id=id;
  if(newMeasure){
    if(metricMode==='weight'){
      const wr = {date:newMeasure.date, kg:newMeasure.value, updatedAt:Date.now()};
      await dbPut('weightLogs', wr);
      const wi = S.weightLogs.findIndex(w=>w.date===wr.date);
      if(wi>-1) S.weightLogs[wi]=wr; else S.weightLogs.push(wr);
    } else {
      const li = rec.metricLogs.findIndex(l=>l.date===newMeasure.date);
      if(li>-1) rec.metricLogs[li].value = (rec.metricKind==='sum' ? (+rec.metricLogs[li].value||0) + newMeasure.value : newMeasure.value); else rec.metricLogs.push({date:newMeasure.date, value:newMeasure.value});
    }
  }
  const newId = await dbPut('projects',rec); rec.id=id||newId;
  const idx = S.projects.findIndex(x=>x.id===rec.id);
  if(idx>-1) S.projects[idx]=rec; else S.projects.push(rec);
  closeModal(); goTo(S.view);
}
async function deleteProject(id){
  await dbDelete('projects',id); S.projects=S.projects.filter(p=>p.id!==id);
  goTo(S.view);
}

/* =========================================================
   ONBOARDING
   ========================================================= */
const OB_STEPS = [
  {key:'name', q:'Como devemos chamar você?', type:'text', ph:'Seu nome'},
  {key:'conquer', q:'O que você quer conquistar?', type:'text', ph:'Ex: Construir uma vida da qual eu tenha orgulho'},
  {key:'mainGoal', q:'Qual é seu principal objetivo neste momento?', type:'text', ph:'Descreva em uma frase'},
  {key:'habit', q:'Qual hábito você quer desenvolver?', type:'text', ph:'Ex: Treinar todos os dias'},
  {key:'project30', q:'Deseja criar uma meta de 30 dias para começar agora?', type:'choice'}
];
let obIdx=0, obAnswers={};
function renderOnboardingStep(){
  const step = OB_STEPS[obIdx];
  const el = document.getElementById('onboarding');
  const progress = OB_STEPS.map((_,i)=>`<span class="${i<=obIdx?'done':''}"></span>`).join('');
  let body;
  if(step.type==='choice'){
    body = `<div style="display:flex;gap:10px;"><button class="btn btn-primary" onclick="obAnswers['${step.key}']=true;obNext()">Sim, criar</button>
      <button class="btn btn-secondary" onclick="obAnswers['${step.key}']=false;obNext()">Agora não</button></div>`;
  } else {
    body = `<div class="field"><input id="ob-input" placeholder="${step.ph}" value="${obAnswers[step.key]||''}"></div>
      <button class="btn btn-primary" onclick="obTextNext()">Continuar</button>`;
  }
  el.innerHTML = `<div class="ob-progress">${progress}</div><div class="ob-step"><h2>${step.q}</h2>${body}</div>`;
  setTimeout(()=>{const i=document.getElementById('ob-input'); if(i) i.focus();},50);
}
function obTextNext(){
  const step = OB_STEPS[obIdx];
  obAnswers[step.key] = document.getElementById('ob-input').value.trim();
  obNext();
}
async function obNext(){
  obIdx++;
  if(obIdx>=OB_STEPS.length){ await finishOnboarding(); return; }
  renderOnboardingStep();
}
async function finishOnboarding(){
  S.profile = {name:obAnswers.name||'', mainGoal:obAnswers.mainGoal||obAnswers.conquer||'', startDate:todayStr()};
  await dbPut('settings',{key:'profile',value:S.profile});
  if(obAnswers.habit){
    const act = {name:obAnswers.habit, goal:'', time:'', weight:2, days:[0,1,2,3,4,5,6], active:true};
    const id = await dbPut('activities',act); act.id=id; S.activities.push(act);
  }
  if(obAnswers.conquer){
    const q = {text:obAnswers.conquer, isFavorite:true};
    const id = await dbPut('quotes',q); q.id=id; S.quotes.push(q);
  }
  if(obAnswers.project30){
    const p = {name:'Meta de 30 dias', objective:obAnswers.mainGoal||'', description:'', startDate:todayStr(), endDate:addDays(todayStr(),29), horizon:'curta', archived:false};
    const id = await dbPut('projects',p); p.id=id; S.projects.push(p);
  }
  await dbPut('settings',{key:'onboardingDone',value:true});
  S.onboardingDone = true;
  document.getElementById('onboarding').classList.add('hidden');
  startApp();
}

/* =========================================================
   BOOTSTRAP
   ========================================================= */
async function startApp(){
  document.getElementById('app').classList.add('ready');
  await reconcileRoutine(todayStr());
  await recomputeScore(todayStr());
  S.view='visao';
  renderShell();
  renderMain();
}

const SW_SOURCE = `
const CACHE_NAME = 'evolve-cache-v1';
self.addEventListener('install', (event) => { self.skipWaiting(); });
self.addEventListener('activate', (event) => {
  event.waitUntil(
    caches.keys().then((keys) => Promise.all(keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k))))
      .then(() => self.clients.claim())
  );
});
self.addEventListener('fetch', (event) => {
  const url = event.request.url;
  if (url.includes('generativelanguage.googleapis.com')) return;
  if (event.request.method !== 'GET') return;
  event.respondWith(
    caches.open(CACHE_NAME).then((cache) =>
      fetch(event.request).then((res) => { cache.put(event.request, res.clone()); return res; })
        .catch(() => cache.match(event.request))
    )
  );
});
`;
function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  try{
    const blob = new Blob([SW_SOURCE], {type:'application/javascript'});
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(()=>{ /* SW registration unsupported here — app still works via IndexedDB */ });
  }catch(e){ /* Blob-based SW not supported in this browser — safe to ignore, app is fully functional without it */ }
}

(async function init(){
  db = await openDB();
  await loadAll();
  registerServiceWorker();
  if(!S.onboardingDone){
    document.getElementById('onboarding').classList.remove('hidden');
    obIdx=0; obAnswers={};
    renderOnboardingStep();
  } else {
    startApp();
  }
})();
</script>
