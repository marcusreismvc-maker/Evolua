function parseAnalysisJSON(text){
  let clean = (text||'').trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  let parsed = null;
  try{ parsed = JSON.parse(clean); }
  catch(e){
    const match = clean.match(/\{[\s\S]*\}/);
    if(match){ try{ parsed = JSON.parse(match[0]); }catch(e2){ parsed = null; } }
  }
  if(!parsed || typeof parsed!=='object'){
    return {resumo: sanitizeAnalysisText(clean) || 'Não foi possível interpretar a resposta da IA.', bemFeito:'', melhorar:'', padroes:[], sinais:[], conversaFranca:'', acoes:[]};
  }
  const str = v => sanitizeAnalysisText(v);
  const arr = v => Array.isArray(v) ? v : [];
  return {
    resumo: str(parsed.resumo),
    bemFeito: str(parsed.bemFeito),
    melhorar: str(parsed.melhorar),
    padroes: arr(parsed.padroes).map(x=>({titulo:str(x&&x.titulo), evidencia:str(x&&x.evidencia), leitura:str(x&&x.leitura)})).filter(x=>x.titulo||x.evidencia||x.leitura),
    sinais: arr(parsed.sinais).map(x=>({trecho:str(x&&x.trecho), data:String((x&&x.data)||'').trim(), porQueImporta:str(x&&x.porQueImporta), comoAbordar:str(x&&x.comoAbordar)})).filter(x=>x.trecho||x.porQueImporta||x.comoAbordar),
    conversaFranca: str(parsed.conversaFranca),
    acoes: arr(parsed.acoes).map(str).filter(Boolean)
  };
}
// Limpeza defensiva caso algum modelo de reserva use markdown; preserva quebras de parágrafo.
function sanitizeAnalysisText(s){
  if(!s) return '';
  return String(s)
    .replace(/\*\*(.*?)\*\*/g,'$1')
    .replace(/\*(.*?)\*/g,'$1')
    .replace(/^[\-\*•]\s+/gm,'')
    .replace(/^#{1,6}\s+/gm,'')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}
const GEMINI_FALLBACK_MODELS = ['gemini-2.5-flash','gemini-3.5-flash-lite','gemini-3.6-flash','gemini-2.0-flash','gemini-1.5-flash'];
let _resolvedGeminiModel = null;

async function resolveGeminiModel(){
  if(_resolvedGeminiModel) return _resolvedGeminiModel;
  const cached = await dbGet('settings','geminiModel');
  if(cached && cached.value){ _resolvedGeminiModel = cached.value; return _resolvedGeminiModel; }
  try{
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${S.geminiApiKey}`);
    if(res.ok){
      const data = await res.json();
      const names = (data.models||[])
        .filter(m => (m.supportedGenerationMethods||[]).includes('generateContent'))
        .map(m => m.name.replace('models/',''));
      // Prefer a "flash" model (fast + cheap), avoid vision/embedding/tts/image-only variants.
      const pick = names.find(n => /flash/i.test(n) && !/vision|embed|tts|image|audio/i.test(n))
                 || names.find(n => /pro/i.test(n) && !/vision|embed|tts|image|audio/i.test(n))
                 || names[0];
      if(pick){ _resolvedGeminiModel = pick; await dbPut('settings',{key:'geminiModel',value:pick}); return pick; }
    }
  }catch(e){ /* fall through to hardcoded fallback list */ }
  _resolvedGeminiModel = GEMINI_FALLBACK_MODELS[0];
  return _resolvedGeminiModel;
}

async function callGemini(prompt, systemInstruction, generationConfig){
  const tried = [];
  let candidates = [await resolveGeminiModel(), ...GEMINI_FALLBACK_MODELS];
  candidates = [...new Set(candidates)];
  let lastError = null;
  const body = {contents:[{parts:[{text:prompt}]}]};
  if(systemInstruction) body.system_instruction = {parts:[{text:systemInstruction}]};
  if(generationConfig) body.generationConfig = generationConfig;
  for(const model of candidates){
    if(tried.includes(model)) continue;
    tried.push(model);
    try{
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${S.geminiApiKey}`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body)
      });
      if(res.status===404){ lastError=new Error('model not found: '+model); continue; } // model retired — try next
      if(!res.ok){ lastError=new Error('Gemini request failed ('+res.status+')'); continue; }
      const data = await res.json();
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if(text===undefined) { lastError=new Error('empty response'); continue; }
      // Success — remember this model so future calls skip straight to it.
      if(model!==_resolvedGeminiModel){ _resolvedGeminiModel=model; await dbPut('settings',{key:'geminiModel',value:model}); }
      return text;
    }catch(e){ lastError=e; }
  }
  throw lastError || new Error('Nenhum modelo Gemini disponível respondeu.');
}

// Per-day score for a project. If the project has linked activities/routines,
// score is based only on those; otherwise falls back to the overall daily evolution index.
// Returns null when the project has links but nothing was scheduled that day (day excluded from the average).
function projectDayIndex(p, date){
  const hasLinks = (p.linkedActivityIds&&p.linkedActivityIds.length) || (p.linkedRoutineIds&&p.linkedRoutineIds.length);
  if(!hasLinks){
    const sc = S.dailyScores.find(x=>x.date===date) || computeDayMetrics(date);
    return sc.evolutionIndex;
  }
  const dow = dowOf(date);
  let routinePct=null, actPct=null;
  if(p.linkedRoutineIds && p.linkedRoutineIds.length){
    const routinesToday = S.routineItems.filter(r=>p.linkedRoutineIds.includes(r.id) && (!r.days||r.days.length===0||r.days.includes(dow)));
    if(routinesToday.length){
      const done = routinesToday.filter(r=>{const l=routineLogFor(r.id,date);return l&&l.status==='done';}).length;
      routinePct = done/routinesToday.length;
    }
  }
  if(p.linkedActivityIds && p.linkedActivityIds.length){
    const actsToday = S.activities.filter(a=>p.linkedActivityIds.includes(a.id) && (!a.days||a.days.length===0||a.days.includes(dow)));
    if(actsToday.length){
      const totalW = actsToday.reduce((s,a)=>s+(a.weight||1),0)||1;
      const doneW = actsToday.reduce((s,a)=> s+(activityLogFor(a.id,date)?(a.weight||1):0),0);
      actPct = doneW/totalW;
    }
  }
  if(routinePct===null && actPct===null) return null;
  if(routinePct===null) return Math.round(actPct*100);
  if(actPct===null) return Math.round(routinePct*100);
  return Math.round((routinePct*0.5+actPct*0.5)*100);
}
function projectProgress(p){
  const total = daysBetween(p.startDate,p.endDate)+1;
  if(total<=0) return 0;
  let sum=0,count=0;
  for(let d=p.startDate; d<=minDateStr(p.endDate,todayStr()); d=addDays(d,1)){
    const idx = projectDayIndex(p,d);
    if(idx!==null){ sum+=idx; count++; }
    if(count>400) break;
  }
  return count ? Math.round(sum/count) : 0;
}
function projectHasLinks(p){ return (p.linkedActivityIds&&p.linkedActivityIds.length) || (p.linkedRoutineIds&&p.linkedRoutineIds.length); }

const HORIZON_LABELS = {curta:'Curto prazo', media:'Médio prazo', longa:'Longo prazo'};

/* ---------- Projeção preditiva (regressão linear) ----------
   Usa OLS sobre os pontos medidos (ignora dias sem registro).
   Para peso: lê automaticamente os weightLogs no intervalo da meta.
   Para métrica numérica: usa valor inicial + registros manuais em p.metricLogs.
*/
function metaMetricPoints(p){
  if(!p.metricMode || p.metricMode==='none') return [];
  let points = [];
  if(p.metricMode==='weight'){
    // medições automáticas do Corpo no intervalo da meta
    points = S.weightLogs
      .filter(w=>w.date>=p.startDate && w.date<=minDateStr(p.endDate, todayStr()))
      .sort((a,b)=>a.date.localeCompare(b.date))
      .map(w=>({date:w.date, value:w.kg, t:daysBetween(p.startDate, w.date)}));
  } else {
    // numeric: logs manuais {date, value}
    points = (p.metricLogs||[])
      .filter(l=>l.date>=p.startDate && l.date<=minDateStr(p.endDate, todayStr()))
      .sort((a,b)=>a.date.localeCompare(b.date))
      .map(l=>({date:l.date, value:+l.value, t:daysBetween(p.startDate, l.date)}));
  }
  // Âncora: valor inicial no dia de início (se ainda não houver medição nesse dia)
  // Isso permite projetar assim que existir 1 medição posterior.
  if(p.metricStart!=null && !points.some(pt=>pt.date===p.startDate)){
    points.unshift({date:p.startDate, value:+p.metricStart, t:0});
  }
  return points.sort((a,b)=>a.t-b.t);
}
// Regressão linear OLS: value = intercept + slope * t  (t = dias desde o início)
function linearRegression(points){
  const n = points.length;
  if(n < 2) return null;
  let sumT=0, sumV=0, sumTT=0, sumTV=0;
  for(const p of points){ sumT+=p.t; sumV+=p.value; sumTT+=p.t*p.t; sumTV+=p.t*p.value; }
  const den = n*sumTT - sumT*sumT;
  if(Math.abs(den) < 1e-12) return null; // todos no mesmo dia
  const slope = (n*sumTV - sumT*sumV) / den;
  const intercept = (sumV - slope*sumT) / n;
  return {slope, intercept};
}
function metaProjection(p){
  if(!p.metricMode || p.metricMode==='none' || p.metricTarget==null || p.metricStart==null) return null;
  const total = daysBetween(p.startDate, p.endDate); // dias até o fim (último dia = total)
  const points = metaMetricPoints(p);
  const start = +p.metricStart;
  const target = +p.metricTarget;
  const unit = p.metricUnit || (p.metricMode==='weight' ? 'kg' : '');
  const needed = target - start; // negativo se emagrecer
  const today = todayStr();

  // Meta ACUMULADA (ex.: juntar dinheiro): cada lançamento soma ao total.
  // Média/dia = total acumulado ÷ dias decorridos; projeção = início + média × dias da meta.
  if(p.metricMode==='numeric' && p.metricKind==='sum'){
    const endD = p.endDate < today ? p.endDate : today;
    const logs = (p.metricLogs||[]).filter(l=>l.date>=p.startDate && l.date<=endD);
    const sum = logs.reduce((a,l)=>a+(+l.value||0),0);
    // Dias contados: todos os dias do início até hoje (inclusive), parando no prazo final.
    // Dia sem lançamento conta como 0.
    const days = Math.max(1, daysBetween(p.startDate, endD)+1);
    const totalDays = total+1;
    const current = start + sum;
    const base = {kind:'sum', points:logs.length, start, target, unit, needed, current};
    if(!logs.length) return {...base, mode:'insufficient', rate:null, projected:null, projectedChange:null, progressPct:0, expectedPct:0};
    const rate = sum/days; // média por dia, contando os dias sem lançamento como 0
    const projected = current + rate*Math.max(0, totalDays-days);
    const dn = target - start;
    const pct = v => Math.abs(dn)<1e-9 ? 0 : Math.round(((v-start)/dn)*100);
    return {...base, mode:'ok', rate, projected, projectedChange: projected-start,
      progressPct: pct(current), projectedPct: pct(projected),
      expectedPct: Math.min(100, Math.round((days/totalDays)*100))};
  }

  if(points.length < 2){
    return {
      mode:'insufficient', points:points.length,
      start, target, unit, needed,
      current: points.length ? points[points.length-1].value : start,
      rate:null, projected:null, projectedChange:null,
      progressPct:0, expectedPct:0
    };
  }
  const reg = linearRegression(points);
  if(!reg){
    return {mode:'insufficient', points:points.length, start, target, unit, needed, current:points[points.length-1].value, rate:null, projected:null, projectedChange:null, progressPct:0, expectedPct:0};
  }
  const current = points[points.length-1].value;
  // taxa diária (slope). Para peso em perda, slope negativo é bom.
  const rate = reg.slope;
  // projeção no último dia da meta
  const projected = reg.intercept + reg.slope * total;
  const projectedChange = projected - start;
  // progresso em direção à meta (0–100+). Funciona para subir ou descer.
  const denom = target - start;
  const progressPct = Math.abs(denom) < 1e-9 ? 0 : Math.round(((current - start) / denom) * 100);
  const projectedPct = Math.abs(denom) < 1e-9 ? 0 : Math.round(((projected - start) / denom) * 100);
  const elapsed = Math.min(total, Math.max(0, daysBetween(p.startDate, Math.min(today, p.endDate))));
  const expectedPct = total > 0 ? Math.round((elapsed / total) * 100) : 0;

  return {
    mode:'ok', points:points.length, start, target, unit, needed,
    current, rate, projected, projectedChange, progressPct, projectedPct, expectedPct,
    reg
  };
}
function metaRagStatus(p){
  const total = daysBetween(p.startDate,p.endDate)+1;
  const today = todayStr();
  const proj = metaProjection(p);

  // ——— Modo métrica (peso / numérico): RAG pela projeção vs meta ———
  if(proj){
    if(today < p.startDate){
      return {status:'green', label:'Ainda não começou', detail:'Meta programada para o futuro', expected:0, actual:0, projection:proj};
    }
    if(proj.mode==='insufficient'){
      {
        let tip = 'Registre medições para gerar a previsão';
        if(p.metricMode==='weight') tip = proj.points<=1 ? 'Registre o peso no Corpo em dias diferentes para projetar (o valor inicial já conta como 1ª medição)' : 'Precisa de pelo menos 2 medições em dias diferentes';
        else if(proj.points===1) tip = 'Toque em "Registrar medição" para lançar o valor de hoje (o inicial já conta como 1ª)';
        else if(proj.points>1) tip = 'Precisa de medições em pelo menos 2 dias diferentes';
        if(proj.kind==='sum') tip = 'Registre o primeiro valor para gerar a previsão';
        return {status:'amber', label:'Dados insuficientes', detail: tip, expected:0, actual:proj.progressPct||0, projection:proj};
      }
    }
    const unit = proj.unit ? ' '+proj.unit : '';
    const rateAbs = Math.abs(proj.rate);
    const rateStr = (proj.rate>=0?'+':'') + proj.rate.toFixed(3).replace(/\.?0+$/,'') + unit + '/dia';
    const projStr = proj.projected.toFixed(2).replace(/\.?0+$/,'') + unit;
    const neededAbs = Math.abs(proj.needed);
    const projChangeAbs = Math.abs(proj.projectedChange);
    // Quão perto a projeção chega da meta? (1.0 = exatamente no alvo, >1 = supera, <1 = fica aquém)
    // Para meta de redução (needed<0) ou aumento (needed>0): ratio = projectedChange / needed
    const ratio = Math.abs(proj.needed) < 1e-9 ? 1 : (proj.projectedChange / proj.needed);

    if(today > p.endDate){
      const finalRatio = Math.abs(proj.needed) < 1e-9 ? 1 : ((proj.current - proj.start) / proj.needed);
      if(finalRatio >= 0.95) return {status:'green', label:'Meta atingida', detail:`Resultado final: ${proj.current.toFixed(2)}${unit}`, expected:100, actual:Math.round(finalRatio*100), projection:proj};
      if(finalRatio >= 0.6) return {status:'amber', label:'Parcialmente atingida', detail:`Ficou em ${proj.current.toFixed(2)}${unit} (meta ${proj.target}${unit})`, expected:100, actual:Math.round(finalRatio*100), projection:proj};
      return {status:'red', label:'Meta não atingida', detail:`Ficou em ${proj.current.toFixed(2)}${unit} (meta ${proj.target}${unit})`, expected:100, actual:Math.round(finalRatio*100), projection:proj};
    }

    // Em andamento — compara projeção com o necessário
    if(ratio >= 1.0){
      return {status:'green', label:'Melhor que o esperado', detail:`Ritmo ${rateStr} → projeção ${projStr} (meta ${proj.target}${unit})`, expected:proj.expectedPct, actual:Math.max(0,proj.progressPct), projection:proj};
    }
    if(ratio >= 0.85){
      return {status:'green', label:'No prazo', detail:`Ritmo ${rateStr} → projeção ${projStr} (meta ${proj.target}${unit})`, expected:proj.expectedPct, actual:Math.max(0,proj.progressPct), projection:proj};
    }
    if(ratio >= 0.6){
      return {status:'amber', label:'Em risco', detail:`Ritmo ${rateStr} → projeção ${projStr} (meta ${proj.target}${unit})`, expected:proj.expectedPct, actual:Math.max(0,proj.progressPct), projection:proj};
    }
    return {status:'red', label:'Atrasada', detail:`Ritmo ${rateStr} → projeção ${projStr} (meta ${proj.target}${unit})`, expected:proj.expectedPct, actual:Math.max(0,proj.progressPct), projection:proj};
  }

  // ——— Fallback: progresso por atividades / índice de evolução ———
  if(today < p.startDate){
    return {status:'green', label:'Ainda não começou', detail:'Meta programada para o futuro', expected:0, actual:0};
  }
  const elapsed = Math.min(total, Math.max(0, daysBetween(p.startDate, today)+1));
  const timePct = total > 0 ? Math.round((elapsed/total)*100) : 0;
  const prog = projectProgress(p);
  const gap = prog - timePct;
  if(today > p.endDate){
    if(prog >= 90) return {status:'green', label:'Concluída no prazo', detail:`Progresso final ${prog}%`, expected:100, actual:prog};
    if(prog >= 60) return {status:'amber', label:'Encerrada parcialmente', detail:`Terminou com ${prog}% de progresso`, expected:100, actual:prog};
    return {status:'red', label:'Não atingiu o objetivo', detail:`Terminou com apenas ${prog}% de progresso`, expected:100, actual:prog};
  }
  if(gap >= -5) return {status:'green', label:'No prazo', detail:`Progresso ${prog}% · esperado ~${timePct}%`, expected:timePct, actual:prog};
  if(gap >= -20) return {status:'amber', label:'Em risco', detail:`Progresso ${prog}% · esperado ~${timePct}%`, expected:timePct, actual:prog};
  return {status:'red', label:'Atrasada', detail:`Progresso ${prog}% · esperado ~${timePct}%`, expected:timePct, actual:prog};
}

    ph:'Ex.:\n• Aumentar o ritmo para X por dia nos próximos 7 dias\n• Cortar o que está atrapalhando (o quê?)\n• Revisar o progresso a cada 3 dias\n• Pedir ajuda a (quem?)' },
  contingency:{ field:'contingencyPlan', title:'Plano de contingência', icon:'🚨',
    when:'Para quando a meta estiver nos piores cenários (atrasada): o que fazer se não der para cumprir como planejado.',
    ph:'Ex.:\n• Qual é o mínimo aceitável?\n• Posso estender o prazo ou reduzir o valor da meta?\n• Qual é o plano B?\n• O que muda na rotina a partir de hoje?' }
};
// Quando a plataforma entende que um plano deve ser usado
function metaPlanSuggestion(p,rag){
  if(!rag || todayStr()<p.startDate) return null;
  if(rag.projection && rag.projection.mode==='insufficient') return null; // sem dados, sem sugestão
  if(rag.status==='amber') return 'mitigation';
  if(rag.status==='red') return 'contingency';
  return null;
}
function metaPlanBannerHtml(p,rag){
  const type = metaPlanSuggestion(p,rag); if(!type) return '';
  const info = META_PLAN_INFO[type];
  const filled = !!(p[info.field]||'').trim();
  const color = type==='contingency' ? 'var(--red)' : '#F5A623';
  const bg = type==='contingency' ? 'rgba(240,71,58,.10)' : 'rgba(255,180,0,.10)';
  const msg = type==='contingency'
    ? 'A projeção está nos piores cenários. Hora de acionar o plano de contingência.'
    : 'A projeção está ruim. Hora de acionar o plano de mitigação.';
  return `<div style="margin:8px 0 4px;padding:10px 12px;border-radius:10px;background:${bg};border:1px dashed ${color};">
    <div style="font-size:12.5px;font-weight:700;color:${color};">${info.icon} Sugestão: ${msg}</div>
    <div class="sub" style="margin:3px 0 8px;">${filled ? 'Seu plano já está escrito — vale revisar e executar.' : 'Você ainda não escreveu este plano.'}</div>
    <button class="btn btn-secondary btn-sm" onclick="openMetaPlan(${p.id},'${type}')">${filled?'Ver plano':'Escrever plano'}</button>
  </div>`;
}
function openMetaPlan(id,type){
  const p = S.projects.find(x=>x.id===id); if(!p) return;
  const info = META_PLAN_INFO[type]; const other = type==='mitigation' ? 'contingency' : 'mitigation';
  const rag = metaRagStatus(p);
  const sug = metaPlanSuggestion(p,rag);
  let data = '';
  const proj = rag.projection;
  if(proj && proj.mode==='ok'){
    const unit = proj.unit ? ' '+proj.unit : '';
    const remaining = daysBetween(todayStr(), p.endDate);
    const fmtR = v => (v>=0?'+':'')+fmtNum(v)+unit+'/dia';
    let need = '';
    if(remaining>0){ need = ` · Ritmo necessário: <b style="color:var(--text);">${fmtR((proj.target-proj.current)/remaining)}</b>`; }
    data = `<div class="sub" style="margin-bottom:10px;line-height:1.5;">Situação: <b style="color:var(--text);">${rag.label}</b><br>Atual ${fmtNum(+proj.current)}${unit} → meta ${fmtNum(proj.target)}${unit} · Ritmo atual: <b style="color:var(--text);">${fmtR(proj.rate)}</b>${need}</div>`;
  } else {
    data = `<div class="sub" style="margin-bottom:10px;">Situação: <b style="color:var(--text);">${rag.label}</b> · ${rag.detail||''}</div>`;
  }
  const banner = sug===type ? `<div style="margin-bottom:10px;padding:8px 10px;border-radius:8px;border:1px dashed ${type==='contingency'?'var(--red)':'#F5A623'};font-size:12.5px;font-weight:600;">Sugerido agora para esta meta.</div>` : '';
  openModal(`
    <h2>${info.icon} ${info.title}</h2>
    <div class="sub" style="margin-bottom:8px;">${escapeHtml(p.name)}</div>
    ${banner}
    <div class="sub" style="margin-bottom:10px;line-height:1.5;">${info.when}</div>
    ${data}
    <div class="field"><textarea id="plan-text" rows="9" placeholder="${info.ph.replace(/"/g,'&quot;')}">${escapeHtml(p[info.field]||'')}</textarea></div>
    <button class="btn btn-primary" onclick="saveMetaPlan(${id},'${type}')">Salvar plano</button>
    <button class="btn btn-ghost" style="margin-top:10px;" onclick="switchMetaPlan(${id},'${type}','${other}')">Ver ${META_PLAN_INFO[other].title.toLowerCase()}</button>
  `);
}
async function saveMetaPlan(id,type,silent){
  const p = S.projects.find(x=>x.id===id); if(!p) return;
  p[META_PLAN_INFO[type].field] = (document.getElementById('plan-text')||{}).value||'';
  await dbPut('projects', p);
  if(!silent){ closeModal(); toast('Plano salvo.'); renderMain(); }
}
async function switchMetaPlan(id,type,other){ await saveMetaPlan(id,type,true); openMetaPlan(id,other); }
function renderMetaCard(p){
  const total = daysBetween(p.startDate,p.endDate)+1;
  const elapsed = Math.min(total,Math.max(0,daysBetween(p.startDate,todayStr())+1));
  const proj = metaProjection(p);
  const rag = metaRagStatus(p);
  // barra de progresso: métrica se disponível, senão atividades
  let barPct = 0;
  if(proj && proj.mode==='ok') barPct = Math.max(0, Math.min(100, proj.progressPct));
  else if(proj && proj.mode==='insufficient' && proj.points>0){
    // progresso parcial só com valor inicial → atual
    const denom = (proj.target - proj.start);
    barPct = Math.abs(denom)<1e-9 ? 0 : Math.max(0, Math.min(100, Math.round(((proj.current - proj.start)/denom)*100)));
  } else barPct = projectProgress(p);

  let done=0,incomplete=0,lost=0;
  for(let d=p.startDate; d<=minDateStr(p.endDate,todayStr()); d=addDays(d,1)){
    const idx = projectDayIndex(p,d);
    if(idx===null) continue;
    if(idx>=75) done++; else if(idx>=40) incomplete++; else lost++;
  }
  const linkedActs = (p.linkedActivityIds||[]).map(id=>S.activities.find(a=>a.id===id)).filter(Boolean);
  const linkedRts = (p.linkedRoutineIds||[]).map(id=>S.routineItems.find(r=>r.id===id)).filter(Boolean);
  const hLabel = HORIZON_LABELS[getHorizon(p)] || '';

  let metricLine = '';
  if(proj){
    const unit = proj.unit ? ' '+proj.unit : '';
    metricLine = `<div class="sub" style="margin-bottom:4px;">${fmtNum(proj.start)}${unit} → meta ${fmtNum(proj.target)}${unit}${proj.current!=null ? ` · atual ${fmtNum(+proj.current)}${unit}` : ''}</div>`;
  }

  // botão para registrar medição (numérico) ou atalho para Corpo (peso)
  let measureBtn = '';
  if(p.metricMode==='numeric'){
    measureBtn = `<button class="btn btn-secondary btn-sm" onclick="openMetaMeasure(${p.id})">${p.metricKind==='sum'?'Adicionar valor':'Registrar medição'}</button>`;
  } else if(p.metricMode==='weight'){
    measureBtn = `<button class="btn btn-secondary btn-sm" onclick="S.view='corpo';S.corpoTab='peso';renderShell();renderMain();">Registrar peso no Corpo</button>`;
  }

  const stats = proj && proj.mode==='ok'
    ? `<div class="mini-stats">
        <div>Progresso <b>${Math.max(0,proj.progressPct)}%</b></div>
        <div>Projeção <b>${Math.max(0,proj.projectedPct)}%</b></div>
        <div>Medições <b>${proj.points}</b></div>
        <div>Dia <b>${Math.max(1,elapsed)}/${total}</b></div>
      </div>`
    : `<div class="mini-stats">
        <div>Progresso <b>${barPct}%</b></div>
        <div>Esperado <b>${rag.expected||0}%</b></div>
        <div>Medições <b>${proj?proj.points:0}</b></div>
        <div>Dia <b>${Math.max(1,elapsed)}/${total}</b></div>
      </div>`;

  return `
    <div class="project-card">
      <div class="top">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="day-tag">${hLabel}</div>
      </div>
      <div class="obj">${escapeHtml(p.objective||'')}</div>
      <div class="sub" style="margin-bottom:4px;">Prazo: ${fmtDatePretty(p.startDate)} → ${fmtDatePretty(p.endDate)} · Dia ${Math.max(1,elapsed)}/${total}</div>
      ${metricLine}
      ${ragBadgeHtml(rag)}
      ${metaPlanBannerHtml(p,rag)}
      ${projectHasLinks(p) ? `<div class="sub" style="margin:8px 0 10px;">Vinculado a: ${[...linkedActs.map(a=>a.name),...linkedRts.map(r=>r.label)].join(', ')}</div>` : ''}
      <div class="progress-track" style="margin-top:8px;"><div class="progress-fill" style="width:${Math.max(0,Math.min(100,barPct))}%;"></div></div>
      ${stats}
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
        ${measureBtn}
        <button class="btn btn-ghost btn-sm" onclick="openMetaPlan(${p.id},'mitigation')">🛡️ Mitigação${(p.mitigationPlan||'').trim()?' ✓':''}</button>
        <button class="btn btn-ghost btn-sm" onclick="openMetaPlan(${p.id},'contingency')">🚨 Contingência${(p.contingencyPlan||'').trim()?' ✓':''}</button>
        <button class="btn btn-ghost btn-sm" onclick="openProjectForm(${p.id})">Editar</button>
        <button class="btn btn-ghost btn-sm" onclick="archiveProject(${p.id})">Arquivar</button>
      </div>
    </div>`;
}
function openMetaMeasure(id){
  const p = S.projects.find(x=>x.id===id); if(!p) return;
  const unit = p.metricUnit ? ' ('+p.metricUnit+')' : '';
  const today = todayStr();
  const isSum = p.metricKind==='sum';
  const existing = isSum ? null : (p.metricLogs||[]).find(l=>l.date===today);
  openModal(`
    <h2>${isSum?'Adicionar valor':'Registrar medição'}</h2>
    <div class="sub" style="margin-bottom:12px;">${escapeHtml(p.name)} · ${fmtDatePretty(today)}</div>
    <div class="field"><label>${isSum?'Quanto adicionar hoje':'Valor de hoje'}${unit}</label>
      <input id="mm-val" type="text" inputmode="decimal" value="${existing?fmtNum(existing.value):''}" placeholder="Ex: 99,5"></div>
    <button class="btn btn-primary" onclick="saveMetaMeasure(${id})">Salvar medição</button>
  `);
}
async function saveMetaMeasure(id){
  const p = S.projects.find(x=>x.id===id); if(!p) return;
  const v = parseNum(document.getElementById('mm-val').value);
  if(isNaN(v)){ toast('Informe um número válido.'); return; }
  const today = todayStr();
  if(!p.metricLogs) p.metricLogs = [];
  const idx = p.metricLogs.findIndex(l=>l.date===today);
  if(idx>-1) p.metricLogs[idx].value = (p.metricKind==='sum' ? (+p.metricLogs[idx].value||0) + v : v);
  else p.metricLogs.push({date:today, value:v});
  await dbPut('projects', p);
  closeModal();
  toast('Medição salva.');
  renderMain();
}

async function saveWeight(){
  const raw = document.getElementById('weightInput').value.replace(',','.');
  const val = parseFloat(raw);
  if(isNaN(val) || val<=0 || val>400){ toast('Informe um peso válido em kg.'); return; }
  const date = todayStr();
  const rec = {date, kg: val, updatedAt:Date.now()};
  await dbPut('weightLogs', rec);
  const idx = S.weightLogs.findIndex(w=>w.date===date);
  if(idx>-1) S.weightLogs[idx]=rec; else S.weightLogs.push(rec);
  const btn = document.getElementById('confirmWeightBtn');
  if(btn){ btn.classList.remove('confirmed'); void btn.offsetWidth; btn.classList.add('confirmed'); }
  toast('Peso confirmado.');
  renderMain();

// Trend is always based on the 3 most recent entries (regardless of gaps between their dates).
function computeWeightTrendHtml(sorted){
  if(sorted.length<3){
    return `<div class="sub">Registre pelo menos 3 dias para a análise de tendência aparecer (faltam ${3-sorted.length}).</div>`;
  }
  const last3 = sorted.slice(-3);
  const [w1,w2,w3] = last3.map(w=>w.kg);
  const diff1 = +(w2-w1).toFixed(3);
  const diff2 = +(w3-w2).toFixed(3);
  let headline;
  if(diff2<0 && diff1<0){
    const rhythm = Math.abs(diff2)<Math.abs(diff1) ? 'o ritmo desacelerou' : Math.abs(diff2)>Math.abs(diff1) ? 'o ritmo acelerou' : 'o ritmo está estável';
    headline = `Você está <b style="color:var(--green);">emagrecendo</b>, mas ${rhythm}.`;
  } else if(diff2>0 && diff1>0){
    const rhythm = Math.abs(diff2)<Math.abs(diff1) ? 'o ritmo desacelerou' : Math.abs(diff2)>Math.abs(diff1) ? 'o ritmo acelerou' : 'o ritmo está estável';
    headline = `Você está <b style="color:var(--red);">engordando</b>, e ${rhythm}.`;
  } else if(diff2===0 && diff1===0){
    headline = `Seu peso está <b>estável</b> nos últimos 3 registros.`;
  } else if(diff2===0){
    headline = `Seu peso <b>não mudou</b> no último registro.`;
  } else if(diff1<0 && diff2>0){
    headline = `Mudança de tendência: você vinha <b style="color:var(--green);">emagrecendo</b> e no último registro passou a <b style="color:var(--red);">engordar</b>.`;
  } else {
    headline = `Mudança de tendência: você vinha <b style="color:var(--red);">engordando</b> e no último registro passou a <b style="color:var(--green);">emagrecer</b>.`;
  }
  return `<div style="font-size:14.5px;line-height:1.5;">${headline}</div>
    <div class="sub" style="margin-top:10px;">Baseado nos 3 últimos registros: ${last3.map(w=>w.kg.toFixed(1)+' kg ('+fmtDatePretty(w.date)+')').join(' → ')}</div>`;
}
function weightSparkline(entries){
  if(entries.length<2) return `<div class="sub">Registre mais dias para ver o gráfico de evolução.</div>`;
  const vals = entries.map(e=>e.kg);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min)||1;
  const w=280,h=80,pad=8;
  const pts = entries.map((e,i)=>{
    const x = pad + (entries.length>1 ? (i/(entries.length-1))*(w-2*pad) : (w/2));
    const y = h-pad - ((e.kg-min)/range)*(h-2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg width="100%" height="80" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;">
    <polyline points="${pts}" fill="none" stroke="var(--orange)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint);margin-top:6px;">
    <span>${entries[0].kg.toFixed(1)} kg</span><span>${entries[entries.length-1].kg.toFixed(1)} kg</span>
  </div>`;
}

/* ----- Sons ----- */
// Sounds are real WAV files generated in memory and played through a single <audio> element.
// Why: on iPhone the Web Audio API is muted by the side "silent" switch and by the browser's autoplay rules,
// while a normal audio element (unlocked once by a tap) keeps playing from timers. Web Audio stays as a fallback.
function makeWavUrl(parts){
  const rate = 22050, amp = 0.65;
  const chunks = [];
  parts.forEach(p=>{
    const n = Math.floor(rate*p.ms/1000), buf = new Int16Array(n);
    if(p.freq){
      const att = Math.floor(rate*0.006), rel = Math.floor(rate*0.025);
      for(let i=0;i<n;i++){
        let env = 1;
        if(i<att) env = i/att; else if(i>n-rel) env = Math.max(0,(n-i)/rel);
        buf[i] = Math.round(Math.sin(2*Math.PI*p.freq*i/rate)*env*amp*32767);
      }
    }
    chunks.push(buf);
  });
  const total = chunks.reduce((s,c)=>s+c.length,0);
  const out = new ArrayBuffer(44+total*2), v = new DataView(out);
  const wr = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
  wr(0,'RIFF'); v.setUint32(4,36+total*2,true); wr(8,'WAVE'); wr(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  wr(36,'data'); v.setUint32(40,total*2,true);
  let off = 44;
  chunks.forEach(c=>{ for(let i=0;i<c.length;i++){ v.setInt16(off,c[i],true); off+=2; } });
  return URL.createObjectURL(new Blob([out],{type:'audio/wav'}));
}
const SOUND_DEFS = {
  exercise: [{freq:880,ms:150},{ms:70},{freq:1175,ms:300}],             // agudo: hora de começar
  rest:     [{freq:587,ms:200},{ms:80},{freq:392,ms:340}],              // grave e descendente: descanse
  tick:     [{freq:1000,ms:110}],                                       // contagem dos 3 últimos segundos
  finish:   [{freq:784,ms:160},{ms:50},{freq:988,ms:160},{ms:50},{freq:1319,ms:420}],
  silence:  [{ms:120}]
};
const SOUND_URLS = {};
let sharedAudio = null, audioUnlocked = false;
function soundUrl(name){
  if(!SOUND_URLS[name]) SOUND_URLS[name] = makeWavUrl(SOUND_DEFS[name]);
  return SOUND_URLS[name];
}
// Must be called from a real tap/click (e.g. the "Iniciar" button) so the browser lets later timer-driven sounds play.
function unlockAudio(){
  try{
    if(!sharedAudio){ sharedAudio = new Audio(); sharedAudio.preload = 'auto'; sharedAudio.setAttribute('playsinline',''); }
    if(!audioUnlocked){
      sharedAudio.src = soundUrl('silence');
      const p = sharedAudio.play();
      if(p && p.then) p.then(()=>{ audioUnlocked = true; }).catch(()=>{});
      else audioUnlocked = true;
    }
  }catch(e){}
  ensureAudioCtx();
}
let audioCtx = null;
function ensureAudioCtx(){
  try{
    const Ctx = window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return null;
    if(!audioCtx) audioCtx = new Ctx();
    if(audioCtx.state==='suspended') audioCtx.resume();
    return audioCtx;
  }catch(e){ return null; }
}
function fallbackBeep(name){
  const ctx = ensureAudioCtx(); if(!ctx) return;
  let t = ctx.currentTime;
  SOUND_DEFS[name].forEach(p=>{
    const d = p.ms/1000;
    if(p.freq){
      try{
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.frequency.value = p.freq; osc.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
        osc.start(t); osc.stop(t+d+0.02);
      }catch(e){}
    }
    t += d;
  });
}
function playSound(name, force){
  if(!force && !S.soundEnabled) return;
  try{
    if(!sharedAudio) unlockAudio();
    sharedAudio.src = soundUrl(name);
    sharedAudio.currentTime = 0;
    const p = sharedAudio.play();
    if(p && p.catch) p.catch(()=>fallbackBeep(name));
  }catch(e){ fallbackBeep(name); }
}
function vibrate(pattern){ if(S.soundEnabled && navigator.vibrate) try{ navigator.vibrate(pattern); }catch(e){} }

/* ----- Keep the screen awake during a workout (otherwise the phone locks and timers/sounds freeze) ----- */
let wakeLock = null;
async function acquireWakeLock(){
  try{
    if('wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release',()=>{ wakeLock = null; });
    }
  }catch(e){ wakeLock = null; }
}
function releaseWakeLock(){ try{ if(wakeLock) wakeLock.release(); }catch(e){} wakeLock = null; }

/* ----- Timer engine (runtime only — not persisted) ----- */
// Time is measured against real timestamps (segEnd), not by counting interval ticks, so it never drifts
// and catches up correctly if the browser throttles the page for a moment.
let timerIntervalId = null;
function flattenSequence(preset){
  const seq = [];
  for(let r=0;r<(preset.loops||1);r++) preset.segments.forEach(seg=>seq.push({...seg}));
  return seq;
}
function startTimer(presetId){
  const preset = S.timerPresets.find(p=>p.id===presetId);
  if(!preset) return;
  unlockAudio(); // inside the tap: allows the automatic sounds that follow
  const sequence = flattenSequence(preset);
  S.timerRun = { presetName:preset.name, sequence, index:0, remaining:sequence[0].seconds, segTotal:sequence[0].seconds,
    paused:false, segEnd:Date.now()+sequence[0].seconds*1000, pausedMs:0, lastTick:null };
  S.corpoTab = 'running';
  renderMain();
  playSound(sequence[0].type==='exercicio'?'exercise':'rest');
  vibrate(150);
  acquireWakeLock();
  clearInterval(timerIntervalId);
  timerIntervalId = setInterval(tickTimer, 250);
}
function tickTimer(){
  const r = S.timerRun; if(!r || r.paused) return;
  const now = Date.now();
  let advanced = false;
  while(now >= r.segEnd){
    r.index++;
    if(r.index >= r.sequence.length){ finishTimer(); return; }
    const seg = r.sequence[r.index];
    r.segTotal = seg.seconds; r.segEnd += seg.seconds*1000; advanced = true;
  }
  r.remaining = Math.max(0, Math.ceil((r.segEnd-now)/1000));
  if(advanced){
    const seg = r.sequence[r.index];
    r.lastTick = r.remaining;
    playSound(seg.type==='exercicio'?'exercise':'rest');
    vibrate(seg.type==='exercicio'?[150]:[80,60,80]);
  } else if(r.remaining>=1 && r.remaining<=3 && r.segTotal>5 && r.lastTick!==r.remaining){
    r.lastTick = r.remaining;
    playSound('tick');
  }
  updateTimerDisplay();
}
function pauseResumeTimer(){
  const r = S.timerRun; if(!r) return;
  unlockAudio();
  if(!r.paused){ r.paused = true; r.pausedMs = Math.max(0, r.segEnd-Date.now()); releaseWakeLock(); }
  else { r.paused = false; r.segEnd = Date.now()+r.pausedMs; acquireWakeLock(); }
  updateTimerDisplay();
}
function skipTimerSegment(){
  const r = S.timerRun; if(!r) return;
  unlockAudio();
  const wasPaused = r.paused;
  r.paused = false; r.segEnd = Date.now();
  tickTimer();
  if(wasPaused && S.timerRun){ S.timerRun.paused = true; S.timerRun.pausedMs = Math.max(0, S.timerRun.segEnd-Date.now()); updateTimerDisplay(); }
}
function stopTimerRun(){
  clearInterval(timerIntervalId); timerIntervalId=null;
  releaseWakeLock();
  if(S.timerRun){ S.timerRun=null; if(S.corpoTab==='running') S.corpoTab='treino'; }
}
function confirmStopTimer(){ stopTimerRun(); renderMain(); }
function finishTimer(){
  clearInterval(timerIntervalId); timerIntervalId=null;
  releaseWakeLock();

const OKR_CELEBRATE_MSGS = [
  'Você fez o que se propôs a fazer. Isso é construir quem você quer se tornar.',
  'Cada resultado-chave concluído foi uma escolha sua. Parabéns pela consistência!',

function launchConfetti(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const old = document.getElementById('confettiCanvas'); if(old) old.remove();
  const cv = document.createElement('canvas'); cv.id='confettiCanvas';
  cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999;';
  document.body.appendChild(cv);
  const dpr = window.devicePixelRatio||1;
  const W = cv.width = window.innerWidth*dpr, H = cv.height = window.innerHeight*dpr;
  const ctx = cv.getContext('2d');
  const colors = ['#FF6A1A','#FFB400','#4ADE80','#38BDF8','#A78BFA','#F472B6','#FFFFFF'];
  const parts = Array.from({length:170},()=>({
    x: Math.random()*W, y: -Math.random()*H*0.6 - 20*dpr,
    w: (6+Math.random()*7)*dpr, h: (8+Math.random()*10)*dpr,
    vx: (Math.random()-.5)*3*dpr, vy: (2.5+Math.random()*4)*dpr,
    rot: Math.random()*Math.PI*2, vr: (Math.random()-.5)*.35,
    c: colors[Math.floor(Math.random()*colors.length)], sway: Math.random()*Math.PI*2
  }));
  const t0 = performance.now(), DUR = 4500;
  (function frame(now){
    const t = now - t0;
    ctx.clearRect(0,0,W,H);
    const fade = t > DUR-800 ? Math.max(0,(DUR-t)/800) : 1;
    ctx.globalAlpha = fade;
    for(const q of parts){
      q.x += q.vx + Math.sin(q.sway += .05)*1.2*dpr; q.y += q.vy; q.rot += q.vr;
      ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(q.rot);
      ctx.fillStyle = q.c; ctx.fillRect(-q.w/2,-q.h/2,q.w,q.h); ctx.restore();
    }
    if(t < DUR) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

  if(kr.mode==='weight'){ const w = latestWeight(); return w===null ? kr.start : w; }

function krDailyStats(kr,o){

function renderOkrKrRows(){
  const el = document.getElementById('o-krs'); if(!el) return;
  const ph = ['Ex: Emagrecer','Ex: Vestir-se bem','Ex: Cuidar da pele'];
  el.innerHTML = okrFormKRs.map((k,i)=>`
    <div class="card" style="padding:12px;margin-bottom:8px;">
      <div class="field-row" style="align-items:center;margin-bottom:8px;">
        <input value="${escapeHtml(k.title||'')}" oninput="okrFormKRs[${i}].title=this.value" placeholder="KR${i+1} — ${ph[i%ph.length]}">
        <button type="button" class="icon-btn" style="width:40px;height:40px;flex-shrink:0;" onclick="removeOkrKr(${i})" aria-label="Remover">✕</button>
      </div>
      <select style="width:100%;background:var(--card-2);border:1px solid var(--border);border-radius:10px;padding:12px 10px;font-size:14.5px;color:var(--text);" onchange="setKrMode(${i},this.value)">
        <option value="check" ${k.mode==='check'?'selected':''}>Feito / não feito — uma vez só</option>
        <option value="daily" ${k.mode==='daily'?'selected':''}>Diário — marco a cada dia (hábito)</option>
        <option value="percent" ${k.mode==='percent'?'selected':''}>Porcentagem (eu atualizo de 0 a 100%)</option>
        <option value="numeric" ${k.mode==='numeric'?'selected':''}>Número (início → meta)</option>
        <option value="weight" ${k.mode==='weight'?'selected':''}>Peso (automático pelo Corpo)</option>
      </select>

        <input type="text" inputmode="decimal" value="${k.start==null?'':fmtNumSafe(k.start)}" oninput="okrFormKRs[${i}].start=this.value" placeholder="${k.mode==='weight'?'Peso inicial (kg)':'Início'}">
        <input type="text" inputmode="decimal" value="${k.target==null?'':fmtNumSafe(k.target)}" oninput="okrFormKRs[${i}].target=this.value" placeholder="${k.mode==='weight'?'Peso meta (kg)':'Meta'}">
        ${k.mode==='numeric' ? `<input value="${escapeHtml(k.unit||'')}" oninput="okrFormKRs[${i}].unit=this.value" placeholder="Unidade (ex: livros)">` : ''}
      </div>` : ''}
    </div>`).join('');
}
function fmtNumSafe(v){ return typeof v==='number' ? fmtNum(v) : escapeHtml(String(v)); }
function setKrMode(i,mode){
  const k = okrFormKRs[i]; k.mode = mode;
  if(mode==='weight' && (k.start==null || k.start==='')){ const w = latestWeight(); if(w!==null) k.start = w; }
  renderOkrKrRows();
}
function addOkrKr(){ okrFormKRs.push({id:Date.now(),title:'',mode:'check'}); renderOkrKrRows(); }
function removeOkrKr(i){
  if(okrFormKRs.length<=1){ toast('Pelo menos um resultado-chave é necessário.'); return; }
  okrFormKRs.splice(i,1); renderOkrKrRows();
}
async function saveOkr(id){
  const objective = document.getElementById('o-title').value.trim();
  const deadline = document.getElementById('o-deadline').value || null;
  const startDate = document.getElementById('o-start').value || todayStr();
  if(!objective){ toast('Informe o objetivo.'); return; }
  if(deadline && deadline<startDate){ toast('O prazo não pode ser antes do início.'); return; }
  if(!deadline && okrFormKRs.some(k=>k.mode==='daily' && (k.title||'').trim())){ toast('Defina o prazo do objetivo para usar KR diário.'); return; }
  const krs = [];
  for(const k of okrFormKRs){
    const title = (k.title||'').trim();
    if(!title) continue;
    if(k.mode==='daily'){
      krs.push({id:k.id, title, mode:'daily', days:Array.isArray(k.days)?k.days:[]});
    } else if(k.mode==='check'){
      krs.push({id:k.id, title, mode:'check', done:!!k.done});
    } else if(k.mode==='percent'){
      krs.push({id:k.id, title, mode:'percent', current:Math.max(0,Math.min(100,parseNum(k.current)||0))});
    } else {
      const start = parseNum(k.start), target = parseNum(k.target);
      if(isNaN(start) || isNaN(target)){ toast(`Preencha início e meta de "${title}".`); return; }
      const curParsed = parseNum(k.current);
      krs.push({id:k.id, title, mode:k.mode, start, target, unit:k.mode==='weight'?'kg':(k.unit||'').trim(),
        current: k.mode==='weight' ? null : (isNaN(curParsed) ? start : curParsed)});
    }
  }
  if(!krs.length){ toast('Adicione pelo menos um resultado-chave.'); return; }
  const existing = id ? S.okrs.find(x=>x.id===id) : null;
  const rec = {objective, deadline, startDate, keyResults:krs, createdAt: existing?existing.createdAt:Date.now()};
  if(id) rec.id = id;
  const newId = await dbPut('okrs', rec); rec.id = id||newId;
  const idx = S.okrs.findIndex(x=>x.id===rec.id);
  if(idx>-1) S.okrs[idx]=rec; else S.okrs.push(rec);
  closeModal(); renderMain();
}
async function deleteOkr(id){
  if(!confirm('Excluir este objetivo e seus resultados-chave?')) return;
  await dbDelete('okrs', id); S.okrs = S.okrs.filter(o=>o.id!==id);
  closeModal(); renderMain();
}
function openKrUpdate(oid,kid){
  const o = S.okrs.find(x=>x.id===oid); const k = o && o.keyResults.find(x=>x.id===kid); if(!k) return;
  const unit = k.unit ? ` (${escapeHtml(k.unit)})` : '';
  openModal(`
    <h2>${escapeHtml(k.title)}</h2>
    <div class="field"><label>${k.mode==='percent'?'Progresso atual (%)':'Valor atual'+unit}</label>
      <input id="kr-cur" type="text" inputmode="decimal" value="${fmtNum(krCurrent(k))}"></div>
    <div class="sub" style="margin-bottom:14px;">${k.mode==='percent'?'Informe de 0 a 100.':`Início ${fmtNum(k.start)} → meta ${fmtNum(k.target)}.`}</div>
    <button class="btn btn-primary" onclick="saveKrUpdate(${oid},${kid})">Salvar</button>
  `);
}
async function toggleKrDay(oid,kid,offset){
  const o = S.okrs.find(x=>x.id===oid); const k = o && o.keyResults.find(x=>x.id===kid); if(!k) return;
  const day = addDays(todayStr(), offset||0);
  const st = krDailyStats(k,o);
  if(day<st.start || day>st.end){ toast('Esse dia está fora do período do objetivo.'); return; }
  const wasDone = okrProgress(o)===100;
  k.days = k.days||[];
  const i = k.days.indexOf(day);
  if(i>-1) k.days.splice(i,1); else k.days.push(day);
  await dbPut('okrs', o);
  renderMain();
  if(!wasDone && okrProgress(o)===100) celebrateOkr(o);
}
async function toggleKrDone(oid,kid){
  const o = S.okrs.find(x=>x.id===oid); const k = o && o.keyResults.find(x=>x.id===kid); if(!k) return;
  const wasDone = okrProgress(o)===100;
  k.done = !k.done;
  await dbPut('okrs', o);
  renderMain();
  if(!wasDone && okrProgress(o)===100) celebrateOkr(o);
}
async function saveKrUpdate(oid,kid){
  const o = S.okrs.find(x=>x.id===oid); const k = o && o.keyResults.find(x=>x.id===kid); if(!k) return;
  let v = parseNum(document.getElementById('kr-cur').value);
  if(isNaN(v)){ toast('Informe um número válido.'); return; }
  if(k.mode==='percent') v = Math.max(0,Math.min(100,v));
  const wasDone = okrProgress(o)===100;
  k.current = v;
  await dbPut('okrs', o);
  closeModal(); toast('Resultado-chave atualizado.'); renderMain();
  if(!wasDone && okrProgress(o)===100) celebrateOkr(o);
}

function daysInMonthYM(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); }
function shiftYM(ym,n){ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function dateInMonth(ym,day){ return `${ym}-${pad(Math.min(day,daysInMonthYM(ym)))}`; }
function nextMonthDate(dateStr,dueDay){ return dateInMonth(shiftYM(dateStr.slice(0,7),1), dueDay||parseInt(dateStr.slice(8,10))); }
function fmtBRL(v){ return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtDM(dateStr){ return `${dateStr.slice(8,10)}/${dateStr.slice(5,7)}`; }
function fmtMonthLabel(ym){ const [y,m]=ym.split('-').map(Number); const s=new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); return s.charAt(0).toUpperCase()+s.slice(1); }
function parseMoney(s){
  s = String(s||'').trim().replace(/[R$\s]/g,'');
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const v = parseFloat(s);
  return isNaN(v) ? NaN : Math.round(v*100)/100;
}

// Occurrences of bills inside a month. Monthly bills are projected into future months so you can plan ahead.
function billOccurrences(ym){
  const out = [];
  S.bills.forEach(b=>{
    const bym = b.dueDate.slice(0,7);
    if(b.recurrence==='monthly'){
      if(bym===ym) out.push({bill:b, date:b.dueDate, projected:false});
      else if(bym<ym) out.push({bill:b, date:dateInMonth(ym, b.dueDay||parseInt(b.dueDate.slice(8,10))), projected:true});
    } else if(bym===ym){
      out.push({bill:b, date:b.dueDate, projected:false});
    }
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date) || a.bill.name.localeCompare(b.bill.name));
}
function shiftFinMonth(n){ S.finMonth = shiftYM(S.finMonth||todayStr().slice(0,7), n); S.finDay = null; renderMain(); }
function selectFinDay(ds){ S.finDay = (S.finDay===ds) ? null : ds; renderMain(); }
function scrollFinStrip(){
  const strip = document.getElementById('finStrip'); if(!strip) return;
  const chip = strip.querySelector('.day-chip.active') || strip.querySelector('.day-chip.today');
  if(chip) strip.scrollLeft = chip.offsetLeft - strip.clientWidth/2 + chip.clientWidth/2;
}

function billRowHtml(o,today){
    const b = o.bill;
    const isOver = !b.paid && !o.projected && o.date<today;
    const diff = daysBetween(today, o.date); // negative = days overdue, positive = days until due
    const isSoon = !b.paid && !o.projected && diff>=0 && diff<=3;
    let status = '';
    if(b.paid) status = 'Paga';
    else if(o.projected) status = 'Previsto';
    else if(isOver) status = diff===-1 ? 'Atrasada há 1 dia' : `Atrasada há ${-diff} dias`;
    else if(diff===0) status = 'Vence hoje';
    else if(diff===1) status = 'Vence amanhã';
    else if(diff<=30) status = `Vence em ${diff} dias`;
    const meta = [fmtDM(o.date), status, (b.recurrence==='monthly' && !b.paid) ? 'todo mês' : ''].filter(Boolean).join(' · ');
    const check = o.projected
      ? `<div class="check-btn" style="opacity:.35;"></div>`
      : `<button class="check-btn ${b.paid?'done':''}" aria-label="Marcar como paga" onclick="toggleBillPaid(${b.id})">${b.paid?'✓':''}</button>`;
    return `
      <div class="activity-row">
        ${check}
        <div class="activity-info" onclick="openBillForm(${b.id})" style="cursor:pointer;">
          <div class="name ${b.paid?'done':''}">${escapeHtml(b.name)}</div>
          <div class="meta" ${isOver?'style="color:var(--red);"':(isSoon?'style="color:var(--orange);"':'')}>${meta}</div>
        </div>
        <div style="font-family:var(--font-mono);font-weight:600;font-size:14px;">${fmtBRL(b.amount)}</div>
      </div>`;
}

function renderFinanceiro(){ S.corpoTab='fin'; return renderCorpo(); }
function renderFinanceiroBody(){
  const ym = S.finMonth || todayStr().slice(0,7);
  const today = todayStr();
  const occ = billOccurrences(ym);
  const paidSum = occ.filter(o=>o.bill.paid).reduce((s,o)=>s+o.bill.amount,0);
  const dueSum = occ.filter(o=>!o.bill.paid).reduce((s,o)=>s+o.bill.amount,0);
  const total = paidSum + dueSum;
  const pct = total ? Math.round((paidSum/total)*100) : 0;
  const overdue = S.bills.filter(b=>!b.paid && b.dueDate<today);
  const overdueSum = overdue.reduce((s,b)=>s+b.amount,0);

  const rows = occ.map(o=>billRowHtml(o,today)).join('');

  // Calendar strip: weekday names (with the day-of-month small underneath) and a marker on days that have bills.
  const wdNames = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  let strip = '';
  for(let d=1; d<=daysInMonthYM(ym); d++){
    const ds = `${ym}-${pad(d)}`;
    const dayOcc = occ.filter(o=>o.date===ds);
    const unpaid = dayOcc.some(o=>!o.bill.paid);
    const mark = dayOcc.length ? `<span class="mark ${unpaid?'has':'ok'}"></span>` : `<span class="mark"></span>`;
    const label = `${wdNames[dowOf(ds)]}, dia ${d}${dayOcc.length?`, ${dayOcc.length} ${dayOcc.length>1?'contas':'conta'}`:''}`;
    strip += `<button class="day-chip ${ds===S.finDay?'active':''} ${ds===today?'today':''}" aria-label="${label}" onclick="selectFinDay('${ds}')"><span class="wd">${wdNames[dowOf(ds)]}</span><span class="dm">${pad(d)}</span>${mark}</button>`;
  }
  const sel = (S.finDay && S.finDay.slice(0,7)===ym) ? S.finDay : null;
  let detail = `<div class="sub" style="margin-bottom:4px;">Toque em um dia para ver as contas dele.</div>`;
  if(sel){
    const selOcc = occ.filter(o=>o.date===sel);
    const wdFull = new Date(sel+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long'});
    detail = `<div class="section-title" style="margin-top:6px;">${wdFull.charAt(0).toUpperCase()+wdFull.slice(1)}, ${fmtDM(sel)}</div>
      <div class="card">${selOcc.length ? selOcc.map(o=>billRowHtml(o,today)).join('') : `<div class="sub" style="text-align:center;padding:8px 0;">Nenhuma conta neste dia.</div>`}</div>`;
  }

  return `

    <div class="diary-nav">
      <button onclick="shiftFinMonth(-1)" aria-label="Mês anterior">‹</button>
      <div class="date-lbl">${fmtMonthLabel(ym)}</div>
      <button onclick="shiftFinMonth(1)" aria-label="Próximo mês">›</button>
    </div>

    <div class="day-strip" id="finStrip" style="position:relative;margin-top:8px;">${strip}</div>
    ${detail}

    <div class="stat-grid" style="margin-top:10px;">
      <div class="stat-card"><div class="num orange">${fmtBRL(dueSum)}</div><div class="lbl">A pagar</div></div>
      <div class="stat-card"><div class="num">${fmtBRL(paidSum)}</div><div class="lbl">Pago</div></div>
    </div>
    <div class="card" style="margin-top:10px;">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-top:8px;">
        <span>${pct}% pago</span><span>Total do mês: <b style="color:var(--text);font-family:var(--font-mono);">${fmtBRL(total)}</b></span>
      </div>
    </div>

    ${overdue.length ? `<div class="dynamic-msg" style="margin-top:12px;border-left-color:var(--red);">Atrasadas: ${overdue.length} ${overdue.length>1?'contas':'conta'} · ${fmtBRL(overdueSum)}</div>` : ''}

    <div class="section-title">Contas do mês</div>
    <div class="card">
      ${rows || `<div class="sub" style="text-align:center;padding:10px 0;">Nenhuma conta neste mês. Planeje a primeira abaixo.</div>`}
    </div>
    <button class="btn btn-secondary" style="margin-top:14px;" onclick="openBillForm()">+ Nova conta</button>
  `;
}

function openBillForm(id){
  const b = id ? S.bills.find(x=>x.id===id) : null;
  openModal(`
    <h2>${b?'Editar conta':'Nova conta'}</h2>
    <div class="field"><label>Nome</label><input id="b-name" value="${b?escapeHtml(b.name):''}" placeholder="Ex: Netflix"></div>
    <div class="field-row">
      <div class="field"><label>Valor (R$)</label><input id="b-amount" type="text" inputmode="decimal" value="${b?String(b.amount).replace('.',','):''}" placeholder="30,00"></div>
      <div class="field"><label>Vencimento</label><input id="b-date" type="date" value="${b?b.dueDate:todayStr()}"></div>
    </div>
    <div class="field"><label>Repetição</label>
      <select id="b-rec">
        <option value="none" ${(!b||b.recurrence!=='monthly')?'selected':''}>Única vez</option>
        <option value="monthly" ${(b&&b.recurrence==='monthly')?'selected':''}>Todo mês</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="saveBill(${id||'null'})">Salvar</button>
    ${b?`<button class="btn btn-danger" style="margin-top:10px;" onclick="deleteBill(${id})">Excluir</button>`:''}
  `);
}
async function saveBill(id){
  const name = document.getElementById('b-name').value.trim();
  const amount = parseMoney(document.getElementById('b-amount').value);
  const dueDate = document.getElementById('b-date').value;
  const recurrence = document.getElementById('b-rec').value;
  if(!name){ toast('Informe o nome da conta.'); return; }
  if(isNaN(amount) || amount<=0){ toast('Informe um valor válido.'); return; }
  if(!dueDate){ toast('Informe a data de vencimento.'); return; }
  const existing = id ? S.bills.find(x=>x.id===id) : null;
  const rec = existing ? {...existing} : {paid:false, paidAt:null};
  Object.assign(rec, {name, amount, dueDate, recurrence: rec.paid ? 'none' : recurrence, dueDay:parseInt(dueDate.slice(8,10))});
  if(id) rec.id = id;
  const newId = await dbPut('bills', rec); rec.id = id||newId;
  const idx = S.bills.findIndex(x=>x.id===rec.id);
  if(idx>-1) S.bills[idx]=rec; else S.bills.push(rec);
  if(!id){ S.finMonth = dueDate.slice(0,7); S.finDay = dueDate; } // jump to the newly planned bill
  closeModal(); renderMain();
}
async function deleteBill(id){
  if(!confirm('Excluir esta conta?')) return;
  await dbDelete('bills', id); S.bills = S.bills.filter(b=>b.id!==id);
  closeModal(); renderMain();
}
async function toggleBillPaid(id){
  const b = S.bills.find(x=>x.id===id); if(!b) return;
  if(!b.paid){
    if(b.recurrence==='monthly'){
      // Keep a paid record for this month and advance the recurring bill to the next month.
      const hist = {name:b.name, amount:b.amount, dueDate:b.dueDate, recurrence:'none', paid:true, paidAt:Date.now(), seriesId:b.id, dueDay:b.dueDay};
      hist.id = await dbPut('bills', hist); S.bills.push(hist);
      b.dueDate = nextMonthDate(b.dueDate, b.dueDay);
      await dbPut('bills', b);
    } else {
      b.paid = true; b.paidAt = Date.now(); await dbPut('bills', b);
    }
    toast('Conta paga.');
  } else if(b.seriesId){
    const orig = S.bills.find(x=>x.id===b.seriesId);
    if(orig && orig.dueDate===nextMonthDate(b.dueDate, orig.dueDay)){
      orig.dueDate = b.dueDate; await dbPut('bills', orig);
      await dbDelete('bills', b.id); S.bills = S.bills.filter(x=>x.id!==b.id);
      toast('Pagamento desfeito.');
    } else {
      toast('Só é possível desfazer o pagamento mais recente de uma conta mensal.');
    }
  } else {
    b.paid = false; b.paidAt = null; await dbPut('bills', b);
    toast('Pagamento desfeito.');
  }
  renderMain();
}

async function requestNotifications(){
  if(!('Notification' in window)){ toast('Notificações não suportadas neste navegador.'); return; }
  const perm = await Notification.requestPermission();
  if(perm==='granted'){ toast('Notificações ativadas.'); await dbPut('settings',{key:'notificationsEnabled',value:true}); startNotificationLoop(); }
  else toast('Permissão negada.');
}
function startNotificationLoop(){
  let lastFired = {};
  setInterval(async ()=>{
    if(Notification.permission!=='granted') return;
    const now = nowHM(), today=todayStr();
    const due = routineForDate(today).filter(r=>{
      const key = r.id+today;
      if(r.time===now && !lastFired[key]){ lastFired[key]=true; return true; }
      return false;
    });
    if(!due.length) return;
    try{
      const reg = await navigator.serviceWorker.ready;
      due.forEach(r=> reg.showNotification('EVOLVE', {body:`Hora de: ${r.label}`, icon:'icon-192.png', badge:'icon-192.png'}));
    }catch(e){ /* service worker unavailable — skip silently */ }
  }, 20000);
}

/* ---------- Mídia da Visão: imagens e vídeos com enquadramento ---------- */
let heroTimer = null;
const MEDIA_URLS = new Map();
function mediaUrl(rec){
  if(!MEDIA_URLS.has(rec.id)) MEDIA_URLS.set(rec.id, URL.createObjectURL(rec.blob));
  return MEDIA_URLS.get(rec.id);
}
function mediaSrc(rec){ return rec.kind==='video' ? mediaUrl(rec) : rec.dataUrl; }
function mediaStyle(c){
  c = c || {x:50,y:50,z:1};
  return `object-position:${c.x}% ${c.y}%;transform:scale(${c.z});transform-origin:${c.x}% ${c.y}%;`;
}
function heroMediaHtml(rec){
  const st = mediaStyle(rec.crop);
  if(rec.kind==='video'){
    return `<video src="${mediaUrl(rec)}" muted loop playsinline preload="auto" style="${st}" data-start="${rec.trimStart||0}" data-end="${rec.trimEnd||0}"></video>`;
  }
  return `<img src="${rec.dataUrl}" style="${st}">`;
}
function bindHeroTrim(v){
  v.addEventListener('timeupdate',()=>{
    const e = +v.dataset.end, st = +v.dataset.start || 0;
    if(e>0 && v.currentTime>=e) v.currentTime = st;
  });
  v.addEventListener('loadedmetadata',()=>{ const st = +v.dataset.start || 0; if(st>0) v.currentTime = st; });
}
function heroDelay(){
  const rec = S.images[visaoImgIdx];
  if(rec && rec.kind==='video'){
    const end = rec.trimEnd || rec.duration || 5;
    const d = end - (rec.trimStart||0);
    return Math.max(3000, Math.min(15000, d*1000));
  }
  return 5000;
}
function heroSchedule(){ clearTimeout(heroTimer); if(S.images.length>1) heroTimer = setTimeout(()=>heroGo(1), heroDelay()); }
function heroGo(step){
  if(S.images.length<2) return;
  visaoImgIdx = (visaoImgIdx+step+S.images.length)%S.images.length;
  updateHeroSlide(); heroSchedule();
}
function heroFrameAspect(){
  // largura real da área de imagem na Visão (altura é fixa em 230px)
  let w = 0;
  const hero = document.getElementById('heroImage');
  if(hero && hero.clientWidth>50) w = hero.clientWidth;
  if(w<=50){
    const m = document.getElementById('main');
    if(m && m.clientWidth>0){ const cs = getComputedStyle(m); w = m.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight); }
  }
  if(w<=50) w = Math.min(window.innerWidth, 760) - 36;
  return Math.max(200,w)/230;
}
function fmtClock(t){ t = Math.max(0,t||0); const m = Math.floor(t/60), sec = (t%60).toFixed(1).padStart(4,'0'); return m+':'+sec; }

let MED = null;
function pickMedia(ev){
  const file = ev.target.files[0]; ev.target.value = ''; if(!file) return;
  const isVid = file.type.startsWith('video/'), isImg = file.type.startsWith('image/');
  if(!isVid && !isImg){ toast('Escolha uma imagem ou um vídeo.'); return; }
  if(isVid && file.size > 80*1024*1024){ toast('Vídeo muito grande (máximo 80 MB).'); return; }
  if(isVid){
    MED = {id:null, kind:'video', blob:file, src:URL.createObjectURL(file), tmpUrl:true, crop:{x:50,y:50,z:1}, start:0, end:0, duration:0};
    openMediaEditor();
  } else {
    const r = new FileReader();
    r.onload = ()=>{ MED = {id:null, kind:'image', dataUrl:r.result, src:r.result, crop:{x:50,y:50,z:1}}; openMediaEditor(); };
    r.readAsDataURL(file);
  }
}
function editMedia(id){
  const rec = S.images.find(i=>i.id===id); if(!rec) return;
  MED = {id, kind:rec.kind||'image', src:mediaSrc(rec), crop:{x:50,y:50,z:1,...(rec.crop||{})},
         start:rec.trimStart||0, end:rec.trimEnd||0, duration:rec.duration||0};
  openMediaEditor();
}
function openMediaEditor(){
  const isV = MED.kind==='video';
  const el = isV ? `<video id="medEl" src="${MED.src}" muted loop playsinline autoplay></video>` : `<img id="medEl" src="${MED.src}" draggable="false">`;
  openModal(`
    <h2>Enquadramento</h2>
    <div class="sub" style="margin-bottom:10px;line-height:1.5;">Arraste para escolher qual parte aparece e use o zoom. A moldura tem o mesmo formato da área na Visão — é assim que vai ficar.</div>
    <div id="medFrame" style="position:relative;width:100%;aspect-ratio:${heroFrameAspect()};border-radius:var(--radius);overflow:hidden;background:#000;border:1px solid var(--border);touch-action:none;cursor:grab;">
      ${el}
      <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent 33%,rgba(255,255,255,.18) 33%,rgba(255,255,255,.18) calc(33% + 1px),transparent calc(33% + 1px),transparent 66%,rgba(255,255,255,.18) 66%,rgba(255,255,255,.18) calc(66% + 1px),transparent calc(66% + 1px)),linear-gradient(to bottom,transparent 33%,rgba(255,255,255,.18) 33%,rgba(255,255,255,.18) calc(33% + 1px),transparent calc(33% + 1px),transparent 66%,rgba(255,255,255,.18) 66%,rgba(255,255,255,.18) calc(66% + 1px),transparent calc(66% + 1px));"></div>
    </div>
    <div class="field" style="margin-top:12px;"><label>Zoom</label>
      <input type="range" id="medZoom" min="100" max="300" value="${Math.round(MED.crop.z*100)}" oninput="medSetZoom(this.value)" style="width:100%;"></div>
    ${isV ? `<div class="field"><label>Trecho do vídeo: <span id="medTrimLbl" style="font-family:var(--font-mono);">—</span></label>
      <input type="range" id="medTs" min="0" max="0" step="0.1" value="0" oninput="medTrim('s')" style="width:100%;">
      <input type="range" id="medTe" min="0" max="0" step="0.1" value="0" oninput="medTrim('e')" style="width:100%;margin-top:6px;">
      <div class="sub">O vídeo toca em loop, sem som, só nesse trecho.</div></div>` : ''}
    <button class="btn btn-primary" onclick="saveMedia()">Salvar</button>
    <button class="btn btn-ghost" style="margin-top:10px;" onclick="cancelMedia()">Cancelar</button>
  `);
  const m = document.getElementById('medEl'), frame = document.getElementById('medFrame');
  applyMedStyle();
  if(isV){
    m.addEventListener('loadedmetadata',()=>{
      MED.nw = m.videoWidth; MED.nh = m.videoHeight; MED.duration = m.duration || 0;
      if(!(MED.end>0) || MED.end>MED.duration) MED.end = MED.duration;
      const ts = document.getElementById('medTs'), te = document.getElementById('medTe');
      ts.max = te.max = MED.duration; ts.value = MED.start; te.value = MED.end;
      medTrimLabel(); m.currentTime = MED.start;
    });
    m.addEventListener('timeupdate',()=>{ if(MED.end>0 && m.currentTime>=MED.end) m.currentTime = MED.start; });
  } else {
    const setDims = ()=>{ MED.nw = m.naturalWidth; MED.nh = m.naturalHeight; };
    if(m.complete && m.naturalWidth) setDims(); else m.addEventListener('load', setDims);
  }
  // arrastar para reposicionar
  let drag = null;
  frame.addEventListener('pointerdown', e=>{ drag = {x:e.clientX, y:e.clientY}; frame.setPointerCapture(e.pointerId); frame.style.cursor='grabbing'; });
  frame.addEventListener('pointermove', e=>{
    if(!drag || !MED.nw) return;
    const dx = e.clientX-drag.x, dy = e.clientY-drag.y; drag = {x:e.clientX, y:e.clientY};
    const fw = frame.clientWidth, fh = frame.clientHeight;
    const sc = Math.max(fw/MED.nw, fh/MED.nh), z = MED.crop.z;
    const effX = MED.nw*sc*z - fw, effY = MED.nh*sc*z - fh;
    if(effX>1) MED.crop.x = Math.max(0,Math.min(100, MED.crop.x - dx/effX*100));
    if(effY>1) MED.crop.y = Math.max(0,Math.min(100, MED.crop.y - dy/effY*100));
    applyMedStyle();
  });
  const end = ()=>{ drag = null; frame.style.cursor='grab'; };
  frame.addEventListener('pointerup', end); frame.addEventListener('pointercancel', end);
}
function applyMedStyle(){
  const m = document.getElementById('medEl'); if(!m) return;
  const c = MED.crop;
  m.style.objectPosition = c.x+'% '+c.y+'%';
  m.style.transform = 'scale('+c.z+')';
  m.style.transformOrigin = c.x+'% '+c.y+'%';
}
function medSetZoom(v){ MED.crop.z = (+v)/100; applyMedStyle(); }
function medTrimLabel(){
  const l = document.getElementById('medTrimLbl'); if(l) l.textContent = fmtClock(MED.start)+' → '+fmtClock(MED.end);
}
function medTrim(which){
  const ts = document.getElementById('medTs'), te = document.getElementById('medTe'), m = document.getElementById('medEl');
  let a = +ts.value, b = +te.value;
  if(b-a < 0.5){ if(which==='s'){ a = Math.max(0,b-0.5); ts.value = a; } else { b = Math.min(MED.duration,a+0.5); te.value = b; } }
  MED.start = a; MED.end = b; medTrimLabel();
  if(m){ m.currentTime = which==='s' ? a : Math.max(a,b-1); }
}
async function saveMedia(){
  const isNew = !MED.id;
  const rec = isNew ? {isMain:S.images.length===0} : S.images.find(i=>i.id===MED.id);
  if(!rec) return;
  rec.kind = MED.kind;
  rec.crop = {x:+MED.crop.x.toFixed(2), y:+MED.crop.y.toFixed(2), z:+MED.crop.z.toFixed(2)};
  if(MED.kind==='image'){
    if(isNew) rec.dataUrl = MED.dataUrl;
  } else {
    if(isNew){ rec.blob = MED.blob; rec.mime = MED.blob.type; }
    rec.duration = MED.duration;
    rec.trimStart = MED.start;
    rec.trimEnd = (MED.end >= MED.duration-0.05) ? 0 : MED.end;
  }
  try{
    const id = await dbPut('images', rec);
    if(isNew){ rec.id = id; S.images.push(rec); }
  }catch(err){
    toast('Não foi possível salvar (espaço insuficiente?).'); return;
  }
  if(MED.tmpUrl) URL.revokeObjectURL(MED.src);
  MED = null;
  openImageManager(); renderMain();
}
function cancelMedia(){
  if(MED && MED.tmpUrl) URL.revokeObjectURL(MED.src);
  MED = null; openImageManager();
}
