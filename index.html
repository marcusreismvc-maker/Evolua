<style>
:root{
  --bg:#0A0A0B;
  --bg-1:#131316;
  --card:#1B1B1F;
  --card-2:#212126;
  --border:#2A2A2F;
  --text:#F3F1EC;
  --text-dim:#96969C;
  --text-faint:#5C5C62;
  --orange:#FF5A1F;
  --orange-dim:#E8480A;
  --orange-glow:rgba(255,90,31,.32);
  --green:#4ADE80;
  --red:#F0473A;
  --radius:16px;
  --radius-sm:10px;
  --font-display:'Bricolage Grotesque',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg);color:var(--text);font-family:var(--font-body);
  font-size:15px;line-height:1.5;overscroll-behavior:none;
}
button,input,textarea,select{font-family:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--orange-glow);}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

.hidden{display:none !important;}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh;}
#app.ready{display:flex;}

.sidebar{
  display:none;width:230px;flex-shrink:0;background:var(--bg-1);
  border-right:1px solid var(--border);padding:28px 16px;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;
}
.sidebar .brand{
  font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:.5px;
  padding:0 12px 28px;color:var(--text);
}
.sidebar .brand span{color:var(--orange);}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);
  color:var(--text-dim);font-weight:500;font-size:14px;transition:background .15s,color .15s;
}
.nav-item .ic{font-size:17px;width:20px;text-align:center;}
.nav-item.active{background:var(--card);color:var(--text);}
.nav-item.active .ic{color:var(--orange);}
.nav-item:hover{color:var(--text);}
.sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid var(--border);}

main{flex:1;min-width:0;padding:20px 18px 100px;max-width:640px;margin:0 auto;width:100%;}
@media (min-width:900px){
  .sidebar{display:flex;}
  main{padding:36px 40px 40px;max-width:760px;}
  .bottom-nav{display:none !important;}
}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;background:rgba(19,19,22,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--border);display:flex;justify-content:space-around;
  padding:8px 2px calc(8px + env(safe-area-inset-bottom));z-index:40;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-faint);
  font-size:10px;font-weight:500;padding:4px 6px;border-radius:10px;transition:color .15s;min-width:44px;flex-shrink:0;}
.bn-item .ic{font-size:18px;}
.bn-item.active{color:var(--orange);}

/* ---------- TOP BAR ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.topbar h1{font-family:var(--font-display);font-weight:800;font-size:22px;}
.topbar .sub{color:var(--text-dim);font-size:12.5px;margin-top:2px;}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card);display:flex;
  align-items:center;justify-content:center;font-size:16px;border:1px solid var(--border);}

@keyframes viewFadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.topbar,.card,.quote-card,.project-card,.empty-state,.stat-card,.day-strip,.diary-nav,.scope-row,.hero-image,.ob-step{
  animation:viewFadeIn .45s cubic-bezier(.16,1,.3,1) both;
}
.card:nth-of-type(2){animation-delay:.04s;}
.card:nth-of-type(3){animation-delay:.08s;}
.card:nth-of-type(4){animation-delay:.12s;}

@keyframes checkPop{0%{transform:scale(.6);}55%{transform:scale(1.18);}100%{transform:scale(1);}}
.check-btn.done{animation:checkPop .32s cubic-bezier(.34,1.56,.64,1);}
.t-item.done .t-dot{animation:checkPop .32s cubic-bezier(.34,1.56,.64,1);}

@keyframes flameBreathe{0%,100%{transform:scale(1);}50%{transform:scale(1.14);}}
.flame-pulse{display:inline-block;animation:flameBreathe 2.4s ease-in-out infinite;}

.ring-progress{transition:stroke-dashoffset 1s cubic-bezier(.16,1,.3,1);}

@keyframes confirmFlash{0%{background:var(--card-2);}40%{background:var(--green);color:#0A0A0B;}100%{background:var(--orange);color:#0A0A0B;}}
.btn.confirmed{animation:confirmFlash .8s ease;}

@keyframes barGrow{from{width:0;}}
.progress-fill{animation:barGrow 1s cubic-bezier(.16,1,.3,1);}

@keyframes iconPop{0%{transform:scale(.7);}60%{transform:scale(1.22);}100%{transform:scale(1);}}
.bn-item.active .ic,.nav-item.active .ic{animation:iconPop .32s cubic-bezier(.34,1.56,.64,1);}

/* ---------- COMPONENTS ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.card + .card{margin-top:12px;}
.section-title{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.6px;
  text-transform:uppercase;color:var(--text-dim);margin:26px 0 10px;}
.section-title:first-child{margin-top:0;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;
  border-radius:12px;font-weight:600;font-size:14.5px;transition:transform .12s,opacity .12s;width:100%;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--orange);color:#0A0A0B;}
.btn-primary:hover{background:#ff6b34;}
.btn-secondary{background:var(--card-2);color:var(--text);border:1px solid var(--border);}
.btn-ghost{background:none;color:var(--text-dim);border:1px solid var(--border);}
.btn-danger{background:none;color:var(--red);border:1px solid rgba(240,71,58,.35);}
.btn-sm{padding:9px 14px;font-size:13px;width:auto;}

.progress-track{height:8px;border-radius:6px;background:var(--card-2);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--orange-dim),var(--orange));
  border-radius:6px;transition:width .5s ease;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;}
.stat-card .num{font-family:var(--font-mono);font-weight:600;font-size:24px;color:var(--text);}
.stat-card .lbl{font-size:11.5px;color:var(--text-dim);margin-top:2px;text-transform:uppercase;letter-spacing:.4px;}
.stat-card .num.orange{color:var(--orange);}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim);}
.empty-state .ic{font-size:30px;margin-bottom:10px;opacity:.6;}
.empty-state p{font-size:14px;margin-bottom:16px;}

.toast-wrap{position:fixed;bottom:90px;left:0;right:0;display:flex;justify-content:center;z-index:200;pointer-events:none;}
@media(min-width:900px){.toast-wrap{bottom:24px;}}
.toast{background:var(--card-2);border:1px solid var(--border);border-left:3px solid var(--orange);
  padding:12px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);
  animation:toastIn .25s ease;max-width:88vw;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;z-index:100;}
@media(min-width:900px){.modal-backdrop{align-items:center;}}
.modal{background:var(--bg-1);border:1px solid var(--border);border-radius:20px 20px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;animation:modalUp .22s ease;}
@media(min-width:900px){.modal{border-radius:20px;}}
@keyframes modalUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal h2{font-family:var(--font-display);font-size:19px;font-weight:700;margin-bottom:16px;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:500;}
.field input,.field textarea,.field select{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;font-size:16px;color:var(--text);
}
.field textarea{resize:vertical;min-height:80px;}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--orange);outline-offset:1px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:8px 13px;border-radius:20px;background:var(--card-2);border:1px solid var(--border);
  font-size:12.5px;color:var(--text-dim);}
.chip.selected{background:var(--orange-glow);border-color:var(--orange);color:var(--orange);}

/* ---------- VISÃO ---------- */
.hero-image{position:relative;border-radius:var(--radius);overflow:hidden;height:230px;
  border:1px solid var(--border);background:var(--card);touch-action:pan-y;}
.hero-image .slide{position:absolute;inset:0;opacity:0;transition:opacity .5s ease;}
.hero-image .slide.active{opacity:1;}
.hero-image img,.hero-image video{width:100%;height:100%;object-fit:cover;display:block;}
.hero-image .add-btn{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);z-index:5;}
.hero-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:5;}
.hero-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);transition:.2s;}
.hero-dots span.active{background:var(--orange);width:16px;border-radius:4px;}

.quote-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;
  position:relative;min-height:76px;display:flex;align-items:center;}
.quote-card .quote-text{font-family:var(--font-display);font-weight:700;font-size:16.5px;line-height:1.4;
  transition:opacity .3s ease;}
.quote-card .quote-idx{position:absolute;bottom:10px;right:14px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);}

.day-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px;-webkit-overflow-scrolling:touch;}
.day-chip{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 12px;
  border-radius:12px;background:var(--card);border:1px solid var(--border);min-width:52px;}
.day-chip.active{background:var(--orange-glow);border-color:var(--orange);}
.day-chip .dow{font-size:10px;color:var(--text-faint);text-transform:uppercase;}
.day-chip .dd{font-family:var(--font-mono);font-weight:600;font-size:14px;}
.day-chip .mark{width:5px;height:5px;border-radius:50%;background:var(--text-faint);}
.day-chip .mark.has{background:var(--orange);}
.day-chip.active .dow,.day-chip.active .dd{color:var(--orange);}

.day-chip .wd{font-family:var(--font-display);font-weight:700;font-size:14px;}
.day-chip .dm{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);}
.day-chip.active .wd,.day-chip.active .dm{color:var(--orange);}
.day-chip.today{border-color:var(--orange-dim);}
.day-chip .mark.ok{background:var(--green);}
.diary-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.diary-nav .date-lbl{font-family:var(--font-display);font-weight:700;font-size:16px;}
.diary-nav button{width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--border);font-size:15px;}
.diary-nav button:disabled{opacity:.3;}

.scope-row{display:flex;gap:8px;margin:14px 0;}
.scope-btn{flex:1;padding:10px 6px;border-radius:10px;background:var(--card);border:1px solid var(--border);
  font-size:12.5px;color:var(--text-dim);text-align:center;font-weight:500;}
.scope-btn.active{background:var(--orange-glow);border-color:var(--orange);color:var(--orange);}

.ring-wrap{display:flex;align-items:center;gap:20px;}
.ring-num{font-family:var(--font-mono);font-weight:600;font-size:15px;fill:var(--text);}
.ring-label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;}

.dynamic-msg{border-left:3px solid var(--orange);padding:14px 16px;background:var(--card);
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:14px;color:var(--text);font-weight:500;}

/* ---------- AGORA / TIMELINE ---------- */
.now-hero{text-align:center;padding:22px 10px 26px;}
.now-clock{font-family:var(--font-mono);font-size:13px;color:var(--text-dim);letter-spacing:1px;}
.now-icon{font-size:34px;margin:10px 0 6px;}
.now-label{font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:.3px;}
.now-status{font-size:12.5px;color:var(--orange);margin-top:4px;font-weight:600;}

/* ---------- AGORA · RELÓGIO E CONTAGEM REGRESSIVA ---------- */
:root{--font-clock:'Jost','Bricolage Grotesque','Inter',sans-serif;}
.clk{font-family:var(--font-clock);font-weight:200;font-variant-numeric:tabular-nums lining-nums;line-height:1;
  display:inline-flex;align-items:baseline;justify-content:center;color:var(--text);}
.dgs{display:inline-flex;align-items:baseline;justify-content:center;}
.dgs .dg{display:inline-block;width:.6em;text-align:center;}
.dgs .sp{display:inline-block;width:.3em;text-align:center;animation:colonFade 2s ease-in-out infinite;}
.dgs .gap{display:inline-block;width:.28em;}
.dgs .tx{display:inline-block;font-size:.42em;font-weight:300;color:var(--text-dim);margin-left:.1em;}
.clk .secs{font-size:.3em;font-weight:300;color:var(--orange);align-self:flex-start;margin:.35em 0 0 .45em;}
@keyframes colonFade{0%,100%{opacity:1;}50%{opacity:.25;}}

.now-hero{padding:26px 6px 24px;}
.ag-clock{font-size:60px;}
.ag-date{margin-top:12px;font-size:12.5px;color:var(--text-faint);letter-spacing:.04em;}
.ag-rule{height:1px;margin:22px 0 4px;background:linear-gradient(90deg,transparent,var(--border) 25%,var(--border) 75%,transparent);}
.ag-next{margin-top:22px;}
.ag-eyebrow{font-size:12px;color:var(--text-dim);letter-spacing:.04em;}
.ag-next-name{font-family:var(--font-display);font-weight:600;font-size:17px;margin-top:6px;}
.ag-count{font-size:56px;margin-top:14px;}
.ag-count .sp{color:var(--orange);}
.ag-bar{position:relative;height:2px;max-width:240px;margin:18px auto 0;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden;}
.ag-bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;background:linear-gradient(90deg,var(--orange-dim),#FFB38A);transition:width 1s linear;}
.ag-at{margin-top:10px;font-size:12.5px;color:var(--text-dim);}
.ag-fs{margin-top:20px;}
.ag-fs svg{width:15px;height:15px;}

/* ---------- CHAT COM A IA ---------- */
main.chat-on{padding-bottom:14px !important;}
.chat-wrap{display:flex;flex-direction:column;height:calc(100dvh - 270px);min-height:320px;}
.chat-msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px;padding:2px 2px 14px;}
.chat-tools{display:flex;justify-content:flex-end;}
.chat-tools button{background:none;border:0;color:var(--text-faint);font-size:12px;padding:2px 0;}
.msg{max-width:90%;font-size:14.5px;line-height:1.55;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;}
.msg.user{align-self:flex-end;background:var(--orange);color:#0A0A0B;font-weight:500;border-radius:18px 18px 4px 18px;padding:10px 14px;}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-radius:18px 18px 18px 4px;padding:12px 15px;}
.msg.ai.err{border-color:rgba(240,71,58,.45);}
.msg .acts{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border);white-space:normal;}
.act-row{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.4;color:var(--text-dim);}
.act-row .ic{flex:none;width:16px;height:16px;border-radius:50%;background:rgba(74,222,128,.14);color:var(--green);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.act-row.bad .ic{background:rgba(240,71,58,.14);color:var(--red);}
.act-nav{align-self:flex-start;background:var(--card-2);border:1px solid var(--border);color:var(--orange);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;}
.typing{display:flex;gap:5px;align-items:center;padding:14px 16px;}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--text-dim);animation:typBounce 1.2s ease-in-out infinite;}
.typing i:nth-child(2){animation-delay:.15s;}.typing i:nth-child(3){animation-delay:.3s;}
@keyframes typBounce{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-4px);opacity:1;}}
.chat-empty{margin:auto 0;text-align:center;padding:10px 6px;}
.chat-empty h3{font-family:var(--font-display);font-size:19px;font-weight:700;margin-bottom:8px;}
.chat-empty p{font-size:13.5px;color:var(--text-dim);line-height:1.55;max-width:320px;margin:0 auto 16px;}
.chat-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.chat-chip{padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:13px;}
.chat-chip:active{background:var(--card-2);}
.chat-composer{display:flex;gap:8px;align-items:flex-end;padding-top:10px;border-top:1px solid var(--border);}
.chat-composer textarea{flex:1;resize:none;min-height:44px;max-height:120px;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:11px 16px;font-size:16px;line-height:1.4;color:var(--text);font-family:inherit;}
.chat-composer textarea:focus{outline:2px solid var(--orange);outline-offset:1px;}
.chat-btn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text-dim);display:flex;align-items:center;justify-content:center;}
.chat-btn svg{width:20px;height:20px;}
.chat-btn.send{background:var(--orange);border-color:var(--orange);color:#0A0A0B;}
.chat-btn.send:disabled{opacity:.4;}
.chat-btn.mic.rec{color:var(--red);border-color:var(--red);animation:pulse 1.4s infinite;}

/* ---------- MEU EU ---------- */
.eu-stage{position:relative;width:100%;max-width:440px;margin:6px auto 0;aspect-ratio:1/1;border-radius:26px;overflow:hidden;background:#000;border:1px solid var(--border);}
.eu-stage::after{content:'';position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(62% 52% at 50% 36%,rgba(255,90,31,.16),transparent 72%),linear-gradient(180deg,transparent 78%,rgba(255,90,31,.06));}
.eu-fig{position:absolute;inset:0;animation:euBreath 9s ease-in-out infinite;transform-origin:50% 60%;}
@keyframes euBreath{0%,100%{transform:scale(1);}50%{transform:scale(1.012);}}
.eu-fig img{width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none;}
.eu-dot{position:absolute;z-index:2;width:46px;height:46px;margin:-23px 0 0 -23px;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.eu-dot i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
  background:#FF7A3D;box-shadow:0 0 0 1.5px rgba(8,8,10,.5),0 0 10px 2px rgba(255,90,31,.55);transition:transform .25s ease,opacity .3s ease;}
.eu-dot i::before,.eu-dot i::after{content:'';position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(255,190,150,.75);box-shadow:0 0 6px rgba(255,90,31,.35);opacity:0;
  animation:euPulse 3.8s ease-out infinite;animation-delay:var(--d,0s);}
.eu-dot i::after{animation-delay:calc(var(--d,0s) + 1.9s);}
@keyframes euPulse{0%{transform:scale(1);opacity:.5;}70%{transform:scale(4.4);opacity:0;}100%{transform:scale(4.4);opacity:0;}}
.eu-dot:hover i,.eu-dot:focus-visible i{transform:scale(1.5);}
.eu-dot:active i{transform:scale(.8);}
.eu-dot.seen i{opacity:.4;box-shadow:none;}
.eu-dot.seen i::before,.eu-dot.seen i::after{animation:none;opacity:0;}
.eu-dot:focus-visible{outline:none;}
.eu-tip{position:absolute;left:50%;bottom:calc(50% + 12px);transform:translateX(-50%);white-space:nowrap;font-size:11px;letter-spacing:.04em;color:var(--text);
  background:rgba(10,10,11,.82);border:1px solid var(--border);border-radius:8px;padding:3px 8px;opacity:0;pointer-events:none;transition:opacity .2s ease;}
.eu-dot:hover .eu-tip,.eu-dot:focus-visible .eu-tip{opacity:1;}
.eu-meta{display:flex;justify-content:space-between;align-items:center;max-width:440px;margin:12px auto 0;font-size:12px;color:var(--text-faint);}
.eu-chips{display:flex;flex-wrap:wrap;gap:8px;max-width:440px;margin:12px auto 0;}
.eu-chip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:13.5px;font-weight:500;}
.eu-chip span{font-size:11.5px;color:var(--text-faint);}
.eu-chip.seen{color:var(--text-dim);}
.eu-chip:active{background:var(--card-2);}
.eu-become{max-width:440px;margin:18px auto 0;}
.eu-become .k{font-size:12px;color:var(--text-faint);letter-spacing:.04em;margin-bottom:6px;}
.eu-become p{font-family:var(--font-display);font-weight:600;font-size:16px;line-height:1.45;}
.eu-become p + p{margin-top:8px;color:var(--text-dim);font-weight:500;font-size:14px;}
/* mapa mental */
.mm-x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--text-dim);font-size:14px;}
#euSheet{position:relative;}
.mm-root{display:flex;align-items:center;gap:14px;padding-right:40px;}
.mm-core{position:relative;flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--orange);display:flex;align-items:center;justify-content:center;background:rgba(255,90,31,.08);}
.mm-core::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 12px var(--orange-glow);}
.mm-core::after{content:'';position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(255,140,90,.55);animation:mmPulse 3.2s ease-out infinite;}
@keyframes mmPulse{0%{transform:scale(1);opacity:.5;}100%{transform:scale(2.1);opacity:0;}}
.mm-title{font-family:var(--font-display);font-weight:700;font-size:21px;line-height:1.1;}
.mm-sub{margin-top:4px;font-size:12.5px;color:var(--text-dim);line-height:1.4;}
.mm-tree{margin:2px 0 0 19px;padding:6px 0 4px 24px;border-left:1px solid rgba(255,90,31,.35);}
.mm-branch{position:relative;margin-top:12px;animation:mmIn .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*90ms + 120ms);}
.mm-branch::before{content:'';position:absolute;left:-24px;top:50%;width:24px;height:1px;background:rgba(255,90,31,.35);transform-origin:left;animation:mmLine .45s ease both;animation-delay:calc(var(--i,0)*90ms + 120ms);}
.mm-branch::after{content:'';position:absolute;left:-27.5px;top:calc(50% - 3px);width:6px;height:6px;border-radius:50%;background:var(--orange);opacity:.8;}
@keyframes mmIn{from{opacity:0;transform:translateX(10px);}to{opacity:1;transform:none;}}
@keyframes mmLine{from{transform:scaleX(0);}to{transform:scaleX(1);}}
.mm-node{background:var(--card-2);border:1px solid var(--border);border-radius:14px;padding:13px 15px;font-size:15px;line-height:1.5;}
.mm-node.empty{color:var(--text-dim);font-style:italic;font-size:14px;}
.mm-edit{display:flex;gap:8px;align-items:flex-start;}
.mm-edit textarea{flex:1;resize:none;min-height:64px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 12px;font-size:16px;line-height:1.45;color:var(--text);}
.mm-edit textarea:focus{outline:2px solid var(--orange);outline-offset:1px;}
.mm-del{flex:none;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--text-dim);font-size:13px;}
.mm-add{width:100%;padding:11px;border-radius:12px;border:1px dashed var(--border);background:transparent;color:var(--orange);font-weight:600;font-size:13.5px;}
.mm-actions{display:flex;gap:8px;margin-top:18px;}

/* ---------- PROTETOR DE TELA ---------- */
.saver{position:fixed;inset:0;z-index:9999;background:#050506;color:var(--text);
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:none;
  --ring:min(90vw,60vh,600px);
  opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s linear .7s;}
.saver.on{opacity:1;visibility:visible;transition:opacity .7s ease,visibility 0s;}
.sv-glow{position:absolute;left:50%;top:50%;width:110vmax;height:110vmax;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,90,31,.11),rgba(255,90,31,.035) 45%,transparent 72%);
  animation:svBreathe 10s ease-in-out infinite;will-change:opacity;}
@keyframes svBreathe{0%,100%{opacity:.55;}50%{opacity:1;}}
.sv-stage{position:relative;width:100%;height:100%;display:grid;
  grid-template-rows:auto 1fr auto;grid-template-areas:"clock" "ring" "now";justify-items:center;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 4vh) 6vw calc(env(safe-area-inset-bottom,0px) + 7vh);
  transition:transform 6s ease-in-out;}
.sv-clockbox{grid-area:clock;text-align:center;}
.sv-clock{font-size:clamp(46px,10vmin,96px);}
.sv-date{margin-top:.9em;font-size:clamp(11px,1.8vmin,15px);color:var(--text-faint);letter-spacing:.05em;}
.sv-ring{grid-area:ring;position:relative;width:var(--ring);height:var(--ring);}
.sv-ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.sv-ring.pulse{animation:svPulse 2.6s ease-out;}
@keyframes svPulse{0%{filter:drop-shadow(0 0 0 rgba(255,90,31,0));}25%{filter:drop-shadow(0 0 36px rgba(255,90,31,.6));}100%{filter:drop-shadow(0 0 0 rgba(255,90,31,0));}}
.tk{stroke:rgba(255,255,255,.13);stroke-width:1;stroke-linecap:round;transition:stroke .5s ease;}
.tk.l{stroke:rgba(255,255,255,.28);}
.tk.t2{stroke:rgba(255,138,84,.35);transition:none;}
.tk.t1{stroke:rgba(255,138,84,.6);transition:none;}
.tk.a{stroke:var(--orange);stroke-width:1.6;transition:none;}
.sv-track{stroke:rgba(255,255,255,.07);stroke-width:1.5;}
#sv-arc{transition:stroke-dashoffset 1s linear;}
#sv-tip{filter:drop-shadow(0 0 6px rgba(255,90,31,.95));}
.sv-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 13%;}
.sv-eyebrow{font-size:max(11px,calc(var(--ring)*.032));color:var(--text-dim);letter-spacing:.05em;}
.sv-name{font-family:var(--font-display);font-weight:600;font-size:max(16px,calc(var(--ring)*.06));margin-top:.55em;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.sv-count{font-size:calc(var(--ring)*.15);margin-top:.28em;transition:font-size .8s ease;}
.sv-count.short{font-size:calc(var(--ring)*.215);}
.sv-count .sp{color:var(--orange);}
.sv-at{margin-top:.9em;font-size:max(12px,calc(var(--ring)*.037));color:var(--text-dim);}
.sv-now{grid-area:now;display:flex;align-items:center;gap:.8em;font-size:clamp(12px,2vmin,16px);color:var(--text-dim);max-width:90vw;}
.sv-now span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sv-now .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 0 var(--orange-glow);animation:pulse 1.8s infinite;}
.sv-now .dot.off{background:var(--text-faint);animation:none;}
.sv-hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 2vh);text-align:center;font-size:12px;color:var(--text-faint);opacity:0;pointer-events:none;}
.saver.on .sv-hint{animation:svHint 6s ease .8s both;}
@keyframes svHint{0%{opacity:0;}15%{opacity:1;}75%{opacity:1;}100%{opacity:0;}}
@media (orientation:landscape) and (max-height:620px){
  .saver{--ring:min(84vh,46vw);}
  .sv-stage{grid-template-columns:1fr auto;grid-template-rows:1fr auto;grid-template-areas:"clock ring" "now ring";column-gap:6vw;
    padding:calc(env(safe-area-inset-top,0px) + 4vh) 5vw calc(env(safe-area-inset-bottom,0px) + 5vh);}
  .sv-clock{font-size:clamp(40px,16vh,84px);}
  .sv-now{justify-self:center;}
}

.timeline{position:relative;padding-left:26px;}
.timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--border);}
.t-item{position:relative;padding-bottom:22px;}
.t-item:last-child{padding-bottom:0;}
.t-dot{position:absolute;left:-26px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--bg-1);
  border:2px solid var(--border);}
.t-item.done .t-dot{background:var(--green);border-color:var(--green);}
.t-item.now .t-dot{background:var(--orange);border-color:var(--orange);box-shadow:0 0 0 5px var(--orange-glow);
  animation:pulse 1.8s infinite;}
.t-item.missed .t-dot{background:var(--bg-1);border-color:var(--red);}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--orange-glow);}50%{box-shadow:0 0 0 8px transparent;}}
.t-time{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);}
.t-item.now .t-time{color:var(--orange);}
.t-title{font-size:14.5px;font-weight:600;margin-top:2px;}
.t-item.done .t-title{color:var(--text-dim);}
.t-tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-top:3px;display:block;}
.t-item.now .t-tag{color:var(--orange);}
.t-item.done .t-tag{color:var(--green);}
.t-item.missed .t-tag{color:var(--red);}

/* ---------- ACTIVITIES ---------- */
.activity-row{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--border);}
.activity-row:last-child{border-bottom:none;}
.check-btn{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:14px;transition:.15s;}

.activity-info{flex:1;min-width:0;}

/* ---------- DIARY ---------- */
.diary-block{margin-bottom:16px;}
.diary-block label{display:block;font-family:var(--font-display);font-weight:700;font-size:13px;
  text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);margin-bottom:8px;}
.diary-block textarea{width:100%;min-height:100px;background:var(--card);border:1px solid var(--border);

.analysis-block{margin-bottom:14px;}
.analysis-block .h{font-family:var(--font-display);font-weight:700;font-size:12px;text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:6px;}
.analysis-block.good .h{color:var(--green);}
.analysis-block.improve .h{color:var(--red);}
.analysis-block.pattern .h{color:var(--text-dim);}
.analysis-block.reco .h{color:var(--orange);}
.analysis-block p{font-size:14px;line-height:1.55;color:var(--text);}
.analysis-block p{white-space:pre-line;}
.an-lead{font-size:15px;line-height:1.65;color:var(--text);white-space:pre-line;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--border);}
.an-sub{font-family:var(--font-display);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);margin:22px 0 10px;}
.an-item{border-left:2px solid var(--border);padding:2px 0 2px 14px;margin-bottom:16px;}
.an-item.signal{border-left-color:var(--orange);}
.an-item .t{font-weight:600;font-size:14.5px;margin-bottom:4px;}
.an-item .q{font-size:13.5px;color:var(--text-dim);font-style:italic;line-height:1.5;margin-bottom:6px;}

.an-item .k{color:var(--text-faint);font-size:11.5px;font-weight:600;letter-spacing:.3px;}
.an-frank{background:var(--card-2);border:1px solid var(--border);border-left:3px solid var(--orange);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:16px 16px 14px;margin-top:22px;}
.an-frank .h{font-family:var(--font-display);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--orange);margin-bottom:8px;}
.an-frank p{font-size:14.5px;line-height:1.7;color:var(--text);white-space:pre-line;}
.an-steps{list-style:none;margin-top:4px;}
.an-steps li{position:relative;padding:0 0 10px 22px;font-size:14px;line-height:1.55;}
.an-steps li::before{content:'';position:absolute;left:3px;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--orange);}

/* ---------- PROJECTS ---------- */
.project-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px;}
.project-card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.project-card .name{font-family:var(--font-display);font-weight:700;font-size:16.5px;}
.project-card .day-tag{font-family:var(--font-mono);font-size:11.5px;color:var(--orange);background:var(--orange-glow);

.mini-stats{display:flex;gap:14px;margin-top:12px;font-size:11.5px;color:var(--text-dim);}

/* ---------- SETTINGS ---------- */
.settings-item{display:flex;align-items:center;justify-content:space-between;padding:15px 4px;
  border-bottom:1px solid var(--border);}
.settings-item:last-child{border-bottom:none;}

.list-row:last-child{border-bottom:none;}
.list-row .name{font-size:14px;font-weight:500;}
.list-row .actions button{font-size:12px;color:var(--text-dim);margin-left:12px;}
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.img-grid .thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:2px solid transparent;}
.img-grid .thumb.main{border-color:var(--orange);}
.img-grid .thumb img,.img-grid .thumb video{width:100%;height:100%;object-fit:cover;display:block;}
.img-grid .thumb .vbadge{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:1px 6px;border-radius:6px;pointer-events:none;}
#medFrame video,#medFrame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-select:none;pointer-events:none;}
.img-grid .thumb button{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);width:20px;height:20px;
  border-radius:50%;font-size:11px;}
.conn-status{font-size:12.5px;padding:8px 12px;border-radius:8px;margin-top:8px;display:inline-block;}
.conn-status.ok{background:rgba(74,222,128,.12);color:var(--green);}

/* ---------- ONBOARDING ---------- */
#onboarding{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;flex-direction:column;
  padding:30px 22px calc(30px + env(safe-area-inset-bottom));}
.ob-progress{display:flex;gap:6px;margin-bottom:34px;}
.ob-progress span{flex:1;height:3px;background:var(--border);border-radius:2px;}
.ob-progress span.done{background:var(--orange);}
.ob-step{flex:1;display:flex;flex-direction:column;justify-content:center;}
.ob-step h2{font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1.3;margin-bottom:22px;}

.history-row .score{font-family:var(--font-mono);font-weight:600;color:var(--orange);}

<body>

<div id="onboarding" class="hidden"></div>

<div id="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"></main>
  <nav class="bottom-nav" id="bottomnav"></nav>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div id="modalRoot"></div>

<script>
/* =========================================================
   EVOLVE — Sistema Pessoal de Evolução
   Single-file offline-first PWA. IndexedDB persistence.
   ========================================================= */

/* ---------- IndexedDB layer ---------- */
const DB_NAME = 'evolve_db', DB_VERSION = 5;
let db;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('settings')) d.createObjectStore('settings',{keyPath:'key'});
      if(!d.objectStoreNames.contains('images')) d.createObjectStore('images',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('quotes')) d.createObjectStore('quotes',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('routineItems')) d.createObjectStore('routineItems',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('activities')) d.createObjectStore('activities',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('activityLogs')) d.createObjectStore('activityLogs',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('routineLogs')) d.createObjectStore('routineLogs',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('projects')) d.createObjectStore('projects',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('diaryLogs')) d.createObjectStore('diaryLogs',{keyPath:'date'});
      if(!d.objectStoreNames.contains('dailyScores')) d.createObjectStore('dailyScores',{keyPath:'date'});
      // aiAnalyses: recreated with autoIncrement id to support multiple scopes (dia/semana/período) per date.
      if(d.objectStoreNames.contains('aiAnalyses')) d.deleteObjectStore('aiAnalyses');
      d.createObjectStore('aiAnalyses',{keyPath:'id',autoIncrement:true});
      // Corpo: weight tracking (one entry per date) and interval-timer presets.
      if(!d.objectStoreNames.contains('weightLogs')) d.createObjectStore('weightLogs',{keyPath:'date'});
      if(!d.objectStoreNames.contains('timerPresets')) d.createObjectStore('timerPresets',{keyPath:'id',autoIncrement:true});
      // Financeiro: contas a pagar (únicas ou mensais).
      if(!d.objectStoreNames.contains('bills')) d.createObjectStore('bills',{keyPath:'id',autoIncrement:true});
      // OKR: objetivos com resultados-chave embutidos.
      if(!d.objectStoreNames.contains('okrs')) d.createObjectStore('okrs',{keyPath:'id',autoIncrement:true});
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
function tx(store,mode='readonly'){ return db.transaction(store,mode).objectStore(store); }
function dbGetAll(store){ return new Promise((res,rej)=>{ const r=tx(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbGet(store,key){ return new Promise((res,rej)=>{ const r=tx(store).get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbPut(store,val){ return new Promise((res,rej)=>{ const r=tx(store,'readwrite').put(val); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function dbDelete(store,key){ return new Promise((res,rej)=>{ const r=tx(store,'readwrite').delete(key); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }

/* ---------- Date/time utils ---------- */
function pad(n){return n.toString().padStart(2,'0');}
function todayStr(d=new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function nowHM(d=new Date()){ return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function dowOf(dateStr){ return new Date(dateStr+'T12:00:00').getDay(); } // 0=Sun
function addDays(dateStr,n){ const d=new Date(dateStr+'T12:00:00'); d.setDate(d.getDate()+n); return todayStr(d); }
function daysBetween(a,b){ return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000); }
function minDateStr(a,b){ return a<b ? a : b; }
function fmtDatePretty(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
}

/* ---------- Global state ---------- */
const S = {
  profile:null, images:[], quotes:[], routineItems:[], activities:[],
  activityLogs:[], routineLogs:[], projects:[], diaryLogs:[], aiAnalyses:[], dailyScores:[],
  weightLogs:[], timerPresets:[], bills:[], okrs:[],
  geminiApiKey:'', onboardingDone:false, view:'visao', diaryDate:null, diaryScope:'day',
  corpoTab:'peso', timerRun:null, soundEnabled:true, projetosTab:'metas', finMonth:null, finDay:null
};

async function loadAll(){
  const [profileRow, geminiRow, obRow] = await Promise.all([
    dbGet('settings','profile'), dbGet('settings','geminiApiKey'), dbGet('settings','onboardingDone')
  ]);
  S.profile = profileRow ? profileRow.value : null;
  S.geminiApiKey = geminiRow ? geminiRow.value : '';
  S.onboardingDone = obRow ? obRow.value : false;
  const sndRow = await dbGet('settings','soundEnabled');
  S.soundEnabled = sndRow ? sndRow.value !== false : true;
  const euRow = await dbGet('settings','meuEu'); S.meuEu = euRow ? euRow.value : null;
  const chRow = await dbGet('settings','chatHistory'); CHAT.messages = (chRow && Array.isArray(chRow.value)) ? chRow.value : [];

/* =========================================================
   EVOLUTION ENGINE — scheduling, completion, scoring
   ========================================================= */
function routineForDate(dateStr){
  const dow = dowOf(dateStr);
  return S.routineItems.filter(r=>r.active!==false && (!r.days || r.days.length===0 || r.days.includes(dow)))
    .sort((a,b)=>a.time.localeCompare(b.time));
}
function activitiesForDate(dateStr){
  const dow = dowOf(dateStr);
  return S.activities.filter(a=>a.active!==false && (!a.days || a.days.length===0 || a.days.includes(dow)));
}
function routineLogFor(routineId,dateStr){ return S.routineLogs.find(l=>l.routineItemId===routineId && l.date===dateStr); }
function activityLogFor(activityId,dateStr){ return S.activityLogs.find(l=>l.activityId===activityId && l.date===dateStr); }

// Auto-mark routine items whose window has fully elapsed today with no log as "missed"
async function reconcileRoutine(dateStr){
  const items = routineForDate(dateStr);
  const now = nowHM();
  const isToday = dateStr===todayStr();
  for(let i=0;i<items.length;i++){
    const item = items[i];
    const next = items[i+1];
    const windowEnd = next ? next.time : '23:59';
    const elapsed = isToday ? (now >= windowEnd) : true;
    if(elapsed && !routineLogFor(item.id,dateStr)){
      const log = {routineItemId:item.id,date:dateStr,status:'missed',completedAt:null};
      const id = await dbPut('routineLogs',log); log.id=id; S.routineLogs.push(log);
    }
  }
}

async function toggleRoutineDone(routineId,dateStr){
  const existing = routineLogFor(routineId,dateStr);
  if(existing && existing.status==='done'){
    await dbDelete('routineLogs',existing.id);
    S.routineLogs = S.routineLogs.filter(l=>l.id!==existing.id);
  } else {
    if(existing){ existing.status='done'; existing.completedAt=Date.now(); await dbPut('routineLogs',existing); }
    else { const log={routineItemId:routineId,date:dateStr,status:'done',completedAt:Date.now()}; const id=await dbPut('routineLogs',log); log.id=id; S.routineLogs.push(log); }
    toast('Concluído.');
  }
  await recomputeScore(dateStr);
}

async function toggleActivityDone(activityId,dateStr){
  const existing = activityLogFor(activityId,dateStr);
  if(existing){
    await dbDelete('activityLogs',existing.id);
    S.activityLogs = S.activityLogs.filter(l=>l.id!==existing.id);
  } else {
    const log = {activityId,date:dateStr,completedAt:Date.now()};
    const id = await dbPut('activityLogs',log); log.id=id; S.activityLogs.push(log);
    toast('+ progresso');
    updateProjectsForActivity(activityId);
  }
  await recomputeScore(dateStr);
}

function updateProjectsForActivity(activityId){
  // projects auto-track via computed progress at render time; nothing to persist here.
}

function computeDayMetrics(dateStr){
  const routine = routineForDate(dateStr);
  const acts = activitiesForDate(dateStr);
  const routineDone = routine.filter(r=>{const l=routineLogFor(r.id,dateStr);return l && l.status==='done';}).length;
  const rotina = routine.length ? (routineDone/routine.length)*100 : 100;

  const totalWeight = acts.reduce((s,a)=>s+(a.weight||1),0) || 1;
  const doneWeight = acts.reduce((s,a)=> s + (activityLogFor(a.id,dateStr) ? (a.weight||1) : 0),0);
  const habitos = acts.length ? (doneWeight/totalWeight)*100 : 100;

  const execucao = Math.round(rotina*0.5 + habitos*0.5);

  // consistency: last 7 days including this one
  let goodDays=0, countedDays=0;
  for(let i=0;i<7;i++){
    const d = addDays(dateStr,-i);
    if(d>todayStr()) continue;
    countedDays++;
    const score = S.dailyScores.find(s=>s.date===d);
    if(score ? score.evolutionIndex>=60 : false) goodDays++;
    else if(d===dateStr && execucao>=60) goodDays++;
  }
  const consistencia = countedDays ? Math.round((goodDays/countedDays)*100) : 100;

  const disciplina = Math.round(execucao*0.6 + consistencia*0.4);
  const evolutionIndex = Math.round(disciplina*0.3 + rotina*0.25 + consistencia*0.2 + execucao*0.15 + habitos*0.1);

  return { evolutionIndex, disciplina, rotina:Math.round(rotina), consistencia, execucao, habitos:Math.round(habitos) };
}

async function recomputeScore(dateStr){
  const m = computeDayMetrics(dateStr);
  const row = {date:dateStr, ...m};
  await dbPut('dailyScores',row);
  const idx = S.dailyScores.findIndex(s=>s.date===dateStr);
  if(idx>-1) S.dailyScores[idx]=row; else S.dailyScores.push(row);
  return row;
}

function currentStreak(){
  let streak=0, d=todayStr();
  while(true){
    const score = S.dailyScores.find(s=>s.date===d) || computeDayMetrics(d);
    if(score.evolutionIndex>=60){ streak++; d=addDays(d,-1); } else break;
    if(streak>365) break;
  }
  return streak;
}

function missedStreak(){
  let streak=0, d=addDays(todayStr(),-1);
  while(true){
    const score = S.dailyScores.find(s=>s.date===d);
    if(score && score.evolutionIndex<40){ streak++; d=addDays(d,-1); } else break;
    if(streak>30) break;
  }
  return streak;
}

function dynamicMessage(todayMetrics){
  const streak = currentStreak();
  const missed = missedStreak();
  if(missed>=3) return {tone:'strong', text:'Cada dia sem cumprir sua meta é um dia mais longe do seu objetivo.'};
  if(missed>=1 && todayMetrics.evolutionIndex<50) return {tone:'direct', text:'Você está repetindo o mesmo padrão. Talvez esteja na hora de parar de negociar com aquilo que você mesmo decidiu fazer.'};
  if(streak>=7) return {tone:'recognition', text:`${streak} dias seguidos. Você está construindo consistência real.`};
  if(todayMetrics.evolutionIndex>=80) return {tone:'recognition', text:'Você fez o que precisava fazer mesmo sem depender de motivação.'};
  if(todayMetrics.evolutionIndex<50) return {tone:'leve', text:'Hoje não saiu como planejado. Amanhã você tem uma nova oportunidade.'};
  return {tone:'neutral', text:'Você sabe onde quer chegar. Agora precisa agir.'};
}

function animateEvoRing(){
  const circle = document.getElementById('evoRingCircle');
  const numEl = document.getElementById('evoRingNum');
  if(!circle || !numEl) return;
  const target = +circle.dataset.target;
  const targetVal = +numEl.dataset.target;
  // Small delay so the CSS transition on stroke-dashoffset actually triggers on top of the initial paint.
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ circle.style.strokeDashoffset = target; }));
  const duration = 900, start = performance.now();
  function tick(now){
    const t = Math.min(1,(now-start)/duration);
    const eased = 1-Math.pow(1-t,3);
    numEl.textContent = Math.round(targetVal*eased);
    if(t<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function agoraSnapshot(nd){
  const today = todayStr(nd);
  const occ = [];
  for(let o=-1;o<=7;o++){
    const ds = addDays(today,o);
    routineForDate(ds).forEach(it=>occ.push({it,ds,dt:new Date(`${ds}T${it.time}:00`)}));
  }
  occ.sort((a,b)=>a.dt-b.dt);
  let prev=null, next=null;
  for(const x of occ){ if(x.dt<=nd) prev=x; else { next=x; break; } }
  return {prev,next,today};
}
const occKey = o => o ? o.ds+'#'+o.it.id : '';
function fmtCountdown(sec){
  const d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600), m=Math.floor(sec%3600/60), s=sec%60;
  if(d>0) return `${d}d ${pad(h)}:${pad(m)}`;
  if(h>0) return `${h}:${pad(m)}:${pad(s)}`;
  return `${pad(m)}:${pad(s)}`;
}
function fmtSpoken(sec){
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60);
  if(h>0) return `${h} h ${m} min`;
  return m>0 ? `${m} min` : `${sec} s`;
}

  return `${new Date(next.ds+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long'})} às ${next.it.time}`;
}

}

      playSound('exercise');
      const ring = SV.el && SV.el.querySelector('.sv-ring');
      if(ring){ ring.classList.remove('pulse'); void ring.offsetWidth; ring.classList.add('pulse'); }
    }
    if(S.view==='agora') renderMain();
  } finally { agoraBusy = false; }
}
function paintAgora(snap,nd){
  const {prev,next,today} = snap;
  const hm = `${pad(nd.getHours())}:${pad(nd.getMinutes())}`, ss = pad(nd.getSeconds());
  const dateTxt = nd.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  let rem=null, cd='', frac=1;
  if(next){
    rem = Math.max(0, Math.ceil((next.dt-nd)/1000));
    cd = fmtCountdown(rem);
    const t0 = prev ? prev.dt : new Date(today+'T00:00:00');
    frac = Math.min(1, Math.max(0, (nd-t0)/(next.dt-t0)));
  }
  const nextName = next ? ((next.it.icon?next.it.icon+' ':'')+next.it.label) : '';
  const nextAt = next ? whenLabel(next,today) : '';

  // cartão "Agora"
  setDigits($id('ag-hm'),hm); setDigits($id('ag-s'),ss);
  setText($id('ag-date'),dateTxt);
  setText($id('ag-next-name'),nextName); setText($id('ag-at'),nextAt);
  setDigits($id('ag-count'),cd);
  const bar=$id('ag-bar'); if(bar) bar.style.width=(frac*100).toFixed(3)+'%';
  const cEl=document.querySelector('.ag-count');
  if(cEl && next){ const lk=nextName+Math.floor(rem/60); if(lk!==agoraLabelKey){ agoraLabelKey=lk; cEl.setAttribute('aria-label',`Faltam ${fmtSpoken(rem)} para ${next.it.label}`); } }

  if(!SV.open || !SV.el) return;
  // protetor de tela
  setDigits($id('sv-hm'),hm); setDigits($id('sv-s'),ss);
  setText($id('sv-date'),dateTxt);
  setText($id('sv-name'),nextName); setText($id('sv-at'),nextAt);
  setDigits($id('sv-count'),cd);
  $id('sv-count').parentElement.classList.toggle('short', rem!==null && rem<3600);
  const ang = frac*2*Math.PI;
  $id('sv-arc').style.strokeDashoffset = (SV_C*(1-frac)).toFixed(2);
  const tip=$id('sv-tip'); tip.setAttribute('cx',(200+168*Math.sin(ang)).toFixed(2)); tip.setAttribute('cy',(200-168*Math.cos(ang)).toFixed(2));
  const sec=nd.getSeconds();
  SV.ticks.forEach((t,i)=>{ const d=(sec-i+60)%60; t.setAttribute('class','tk'+(i%5===0?' l':'')+(d===0?' a':d===1?' t1':d===2?' t2':'')); });
  const cur = (prev && prev.ds===today) ? ((prev.it.icon?prev.it.icon+' ':'')+prev.it.label) : '';
  setText($id('sv-now-t'), cur ? 'Agora: '+cur : 'O dia ainda não começou');
  $id('sv-dot').classList.toggle('off',!cur);
}

function ensureSaver(){
  if(SV.el) return SV.el;
  const ticks = [...Array(60)].map((_,i)=>{
    const a=i*6*Math.PI/180, long=i%5===0, r1=long?185:191, r2=198;
    return `<line class="tk${long?' l':''}" x1="${(200+r1*Math.sin(a)).toFixed(2)}" y1="${(200-r1*Math.cos(a)).toFixed(2)}" x2="${(200+r2*Math.sin(a)).toFixed(2)}" y2="${(200-r2*Math.cos(a)).toFixed(2)}"/>`;
  }).join('');
  const el = document.createElement('div');
  el.id='nowSaver'; el.className='saver'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Contagem regressiva até a próxima atividade');
  el.innerHTML = `
    <div class="sv-glow"></div>
    <div class="sv-stage" id="sv-stage">
      <div class="sv-clockbox">
        <div class="clk sv-clock"><span class="dgs" id="sv-hm"></span><span class="dgs secs" id="sv-s"></span></div>
        <div class="sv-date" id="sv-date"></div>
      </div>
      <div class="sv-ring">
        <svg viewBox="0 0 400 400" aria-hidden="true">
          <defs><linearGradient id="svGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8480A"/><stop offset="1" stop-color="#FFB38A"/></linearGradient></defs>
          <g>${ticks}</g>
          <circle class="sv-track" cx="200" cy="200" r="168" fill="none"/>
          <circle id="sv-arc" cx="200" cy="200" r="168" fill="none" stroke="url(#svGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="${SV_C.toFixed(2)}" stroke-dashoffset="${SV_C.toFixed(2)}" transform="rotate(-90 200 200)"/>
          <circle id="sv-tip" r="4.5" cx="200" cy="32" fill="#FFB38A"/>
        </svg>
        <div class="sv-center">
          <div class="sv-eyebrow">Próxima atividade</div>
          <div class="sv-name" id="sv-name"></div>
          <div class="clk sv-count" role="timer" aria-live="off"><span class="dgs" id="sv-count"></span></div>
          <div class="sv-at" id="sv-at"></div>
        </div>
      </div>
      <div class="sv-now"><i class="dot" id="sv-dot"></i><span id="sv-now-t"></span></div>
    </div>
    <div class="sv-hint">Toque para sair</div>`;
  // o contador interno herda a classe .clk; o elemento com id recebe o 'short'
  el.addEventListener('click',()=>closeSaver());
  document.body.appendChild(el);
  SV.el = el; SV.ticks = el.querySelectorAll('.tk');
  return el;
}
function openSaver(){
  const el = ensureSaver();
  if(SV.open) return;
  SV.open = true;
  try{ unlockAudio(); }catch(e){}
  el.classList.add('on');
  acquireWakeLock();
  const f = el.requestFullscreen || el.webkitRequestFullscreen;
  if(f){ try{ const pr=f.call(el,{navigationUI:'hide'}); if(pr&&pr.catch) pr.catch(()=>{}); }catch(e){} }
  SV.drift = setInterval(svDrift,60000);
  document.addEventListener('keydown',svKey);
  agoraTick();
}
function closeSaver(fromFs){
  if(!SV.open) return;
  SV.open = false; SV.fs = false;
  if(SV.el) SV.el.classList.remove('on');
  clearInterval(SV.drift); SV.drift=null;
  document.removeEventListener('keydown',svKey);
  const st=$id('sv-stage'); if(st) st.style.transform='';
  if(!fromFs){
    try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
         else if(document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen(); }catch(e){}
  }
  if(!(S.timerRun && !S.timerRun.paused)) releaseWakeLock(); // não solta se há um treino em andamento
}
function svKey(e){ if(e.key==='Escape') closeSaver(); }
// Deslocamento mínimo a cada minuto: evita "queimar" a imagem em telas OLED
function svDrift(){
  const st=$id('sv-stage'); if(!st) return;
  st.style.transform=`translate(${Math.round(Math.random()*16-8)}px,${Math.round(Math.random()*16-8)}px)`;
}
function svFsChange(){
  const fe = document.fullscreenElement || document.webkitFullscreenElement;
  if(fe && fe===SV.el){ SV.fs = true; }
  else if(SV.open && SV.fs){ closeSaver(true); } // saiu da tela cheia pelo gesto/botão voltar
}
document.addEventListener('fullscreenchange',svFsChange);
document.addEventListener('webkitfullscreenchange',svFsChange);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){ if(SV.open) acquireWakeLock(); if(S.view==='agora') agoraTick(); }
});

const EU_AREAS = [
  {id:'mente',   label:'Mente',    x:49,   y:8.5, d:0,   q:'Como a sua cabeça trabalha? O que você faz melhor ao pensar e decidir?',
    def:['Marcus é apaixonado por números e processos','Cumpre suas metas e é um exemplo']},
  {id:'coracao', label:'Coração',  x:54.5, y:55, d:.9,  q:'Que energia e que sentimentos você leva para as pessoas?',
    def:['Marcus é carismático e tem muito entusiasmo']},
  {id:'mao',     label:'Atitude',  x:33,   y:50, d:1.8, q:'O que você cobra de si mesmo e conduz com firmeza?', def:[]},
  {id:'corpo',   label:'Corpo',    x:79,   y:47, d:2.7, q:'Como você cuida do corpo e da sua energia?', def:[]},
  {id:'imagem',  label:'Imagem',   x:62.5, y:96, d:3.3, q:'Que imagem você passa e o que ela provoca nos outros?',
    def:['Marcus se veste bem e sabe que os outros o tratam melhor por isso']}
];
let EU_EDIT = null, EU_CUR = null;
function euData(){
  if(!S.meuEu || typeof S.meuEu!=='object') S.meuEu = {};
  if(!S.meuEu.traits) S.meuEu.traits = {};
  if(!S.meuEu.seen) S.meuEu.seen = {};
  return S.meuEu;
}
function euTraits(id){
  const d = euData();
  if(Array.isArray(d.traits[id])) return d.traits[id];
  const a = EU_AREAS.find(x=>x.id===id); return a ? a.def.slice() : [];
}
async function euPersist(){ await dbPut('settings',{key:'meuEu',value:euData()}); }
function euChipsHtml(){
  const d = euData();
  return EU_AREAS.map(a=>`<button class="eu-chip ${d.seen[a.id]?'seen':''}" onclick="euOpen('${a.id}')">${a.label}<span>${euTraits(a.id).length}</span></button>`).join('');
}
function renderEu(){
  const d = euData(), name = (S.profile && S.profile.name) || '';
  const seen = EU_AREAS.filter(a=>d.seen[a.id]).length;
  const dots = EU_AREAS.map(a=>`
    <button class="eu-dot ${d.seen[a.id]?'seen':''}" data-a="${a.id}" style="left:${a.x}%;top:${a.y}%;--d:${a.d}s" onclick="euOpen('${a.id}')" aria-label="Abrir o mapa mental: ${a.label}"><i></i><span class="eu-tip">${a.label}</span></button>`).join('');
  const become = S.profile && (S.profile.conquer || S.profile.mainGoal)
    ? `<div class="card eu-become"><div class="k">Quem estou me tornando</div>
        ${S.profile.conquer?`<p>${escapeHtml(S.profile.conquer)}</p>`:''}
        ${S.profile.mainGoal?`<p>${escapeHtml(S.profile.mainGoal)}</p>`:''}</div>` : '';
  return `
    ${topbarHtml('Meu eu','Toque nos pontos de luz para explorar o seu mapa mental')}
    <div class="eu-stage"><div class="eu-fig"><img src="${EU_AVATAR}" alt="Avatar${name?' de '+escapeHtml(name):''}" draggable="false">${dots}</div></div>
    <div class="eu-meta"><span>Mapa explorado</span><span id="euSeen">${seen}/${EU_AREAS.length}</span></div>
    <div class="eu-chips" id="euChips">${euChipsHtml()}</div>
    ${become}`;
}
function euSheetHtml(id){
  const a = EU_AREAS.find(x=>x.id===id); if(!a) return '';
  const editing = !!(EU_EDIT && EU_EDIT.id===id);
  const list = editing ? EU_EDIT.draft : euTraits(id);
  let tree;
  if(editing){
    tree = list.map((t,i)=>`<div class="mm-branch" style="--i:${i}"><div class="mm-edit">
        <textarea rows="2" maxlength="220" placeholder="Escreva um traço seu…" oninput="EU_EDIT.draft[${i}]=this.value">${escapeHtml(t)}</textarea>
        <button class="mm-del" onclick="euDel(${i})" aria-label="Remover traço">✕</button></div></div>`).join('')
      + `<div class="mm-branch" style="--i:${list.length}"><button class="mm-add" onclick="euAdd()">+ Adicionar traço</button></div>`;
  } else if(list.length){
    tree = list.map((t,i)=>`<div class="mm-branch" style="--i:${i}"><div class="mm-node">${escapeHtml(t)}</div></div>`).join('');
  } else {
    tree = `<div class="mm-branch" style="--i:0"><div class="mm-node empty">${escapeHtml(a.q)}</div></div>`;
  }
  return `
    <button class="mm-x" onclick="closeModal()" aria-label="Fechar">✕</button>
    <div class="mm-root"><div class="mm-core"></div><div><div class="mm-title">${a.label}</div><div class="mm-sub">${editing?'Editando os traços desta área':escapeHtml(a.q)}</div></div></div>
    <div class="mm-tree">${tree}</div>
    <div class="mm-actions">${editing
      ? `<button class="btn btn-primary btn-sm" onclick="euSave()">Salvar</button><button class="btn btn-ghost btn-sm" onclick="euCancel()">Cancelar</button>`
      : `<button class="btn btn-ghost btn-sm" onclick="euEdit()">${list.length?'Editar traços':'Escrever traços'}</button>`}</div>`;
}
function euRerender(){ const el=document.getElementById('euSheet'); if(el && EU_CUR) el.innerHTML = euSheetHtml(EU_CUR); }
function euOpen(id){
  EU_EDIT = null; EU_CUR = id;
  openModal(`<div id="euSheet">${euSheetHtml(id)}</div>`);
  const d = euData();
  if(!d.seen[id]){
    d.seen[id] = true; euPersist();
    const dot = document.querySelector(`.eu-dot[data-a="${id}"]`); if(dot) dot.classList.add('seen');
    const ch = document.getElementById('euChips'); if(ch) ch.innerHTML = euChipsHtml();
    const n = document.getElementById('euSeen'); if(n) n.textContent = EU_AREAS.filter(a=>d.seen[a.id]).length+'/'+EU_AREAS.length;
  }
}
function euEdit(){ EU_EDIT = {id:EU_CUR, draft:euTraits(EU_CUR).slice()}; if(!EU_EDIT.draft.length) EU_EDIT.draft.push(''); euRerender(); }

async function chatSend(text){

async function geminiRequest(body){
  const candidates = [...new Set([await resolveGeminiModel(), ...GEMINI_FALLBACK_MODELS])];
  let lastError = null;
  for(const model of candidates){
    try{
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${S.geminiApiKey}`,{
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
      });
      if(res.status===404){ lastError = new Error('modelo indisponível: '+model); continue; }
      if(!res.ok){
        let msg=''; try{ const j = await res.json(); msg = (j.error && j.error.message) || ''; }catch(e){}
        lastError = new Error('Gemini '+res.status+(msg?': '+msg.slice(0,120):''));
        if(res.status===401 || res.status===403 || /API key/i.test(msg)) throw lastError;
        continue;
      }
      const data = await res.json();
      if(!data.candidates || !data.candidates.length){ lastError = new Error('resposta vazia'); continue; }
      if(model!==_resolvedGeminiModel){ _resolvedGeminiModel = model; await dbPut('settings',{key:'geminiModel',value:model}); }
      return data;
    }catch(e){ lastError = e; if(/API key|Gemini 40[13]/.test(e.message||'')) throw e; }
  }
  throw lastError || new Error('Nenhum modelo Gemini respondeu.');
}

async function chatRun(){
  const contents = CHAT.messages.filter(m=>!m.error).slice(-24).map(m=>({
    role: m.role==='user' ? 'user' : 'model',
    parts: [{text: m.role==='user' ? m.text : (m.text + ((m.actions&&m.actions.length) ? '\n[Ações realizadas: '+m.actions.map(a=>a.text).join('; ')+']' : ''))}]
  }));
  while(contents.length && contents[0].role!=='user') contents.shift();
  const system = chatSystemText();
  const actions = []; let finalText = '';
  for(let step=0; step<8; step++){
    const data = await geminiRequest({
      contents, system_instruction:{parts:[{text:system}]},
      tools:[{functionDeclarations:CHAT_TOOLS}],
      generationConfig:{temperature:.6, maxOutputTokens:4096}
    });
    const cand = data.candidates[0], content = cand.content, parts = (content && content.parts) || [];
    const calls = parts.filter(p=>p.functionCall);
    if(!calls.length){
      finalText = parts.filter(p=>typeof p.text==='string' && !p.thought).map(p=>p.text).join('').trim();
      if(!finalText && cand.finishReason && cand.finishReason!=='STOP') finalText = 'Não consegui concluir essa resposta. Tente reformular o pedido.';
      break;
    }
    contents.push({role:'model', parts:content.parts}); // preserva a resposta original (inclui assinaturas de raciocínio)
    const responses = [];
    for(const c of calls){
      const r = await chatExec(c.functionCall.name, c.functionCall.args || {});
      actions.push(r.action);
      responses.push({functionResponse:{name:c.functionCall.name, response:{result:r.data}}});
    }
    contents.push({role:'user', parts:responses});
  }
  if(!finalText) finalText = actions.length ? 'Pronto.' : 'Não recebi resposta da IA. Tente novamente.';
  if(actions.some(a=>a.ok && !a.nav)){ try{ await reconcileRoutine(todayStr()); await recomputeScore(todayStr()); }catch(e){} }
  return {text:finalText, actions};
}
async function chatExec(name,args){
  const fn = CHAT_EXEC[name];
  if(!fn) return {data:{ok:false,erro:'Função desconhecida: '+name}, action:{ok:false,text:'Ação desconhecida: '+name}};
  try{
    const r = await fn(args||{});
    const action = {ok:true, text:r.resumo||name}; if(r.nav) action.nav = r.nav;
    return {data:r, action};
  }catch(e){
    const msg = (e && e.message) || String(e);
    return {data:{ok:false,erro:msg}, action:{ok:false,text:msg}};
  }
}

const CH_RE = /^\d{4}-\d{2}-\d{2}$/;
function chDate(v,def){ if(v==null||v==='') return def||todayStr(); v=String(v).trim(); if(!CH_RE.test(v)||isNaN(new Date(v+'T12:00:00'))) throw new Error('Data inválida: '+v+' (use AAAA-MM-DD).'); return v; }
function chTime(v){ const m=String(v==null?'':v).trim().match(/^(\d{1,2})[:h](\d{2})$/); if(!m||+m[1]>23||+m[2]>59) throw new Error('Horário inválido: '+v+' (use HH:MM).'); return pad(+m[1])+':'+m[2]; }
function chDays(v){ if(v==null) return null; if(!Array.isArray(v)) throw new Error('"dias" deve ser uma lista de 0 a 6.'); const d=[...new Set(v.map(Number))].filter(n=>Number.isInteger(n)&&n>=0&&n<=6).sort(); return d.length?d:null; }
function chNum(v,name){ if(typeof v==='number'&&isFinite(v)) return v; let s=String(v==null?'':v).trim().replace(/[^\d,.\-]/g,''); if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=parseFloat(s); if(isNaN(n)) throw new Error((name||'Valor')+' inválido.'); return n; }
function chStr(v){ return String(v==null?'':v).trim(); }
function chFind(list,id,what){ const x=list.find(i=>i.id===Number(id)); if(!x) throw new Error('Não encontrei '+what+' com id '+id+'.'); return x; }
function chIds(arr,list){ return Array.isArray(arr) ? [...new Set(arr.map(Number))].filter(i=>list.some(x=>x.id===i)) : []; }
const CH_ALL = [0,1,2,3,4,5,6];
const has = (a,k)=>a[k]!==undefined && a[k]!==null;

  registrar_diario: async a=>{
    const date = chDate(a.data);
    const log = S.diaryLogs.find(d=>d.date===date) || {date,manha:'',tarde:'',noite:''};
    const mode = a.modo==='substituir' ? 'substituir' : 'adicionar';
    const lbl = {manha:'manhã',tarde:'tarde',noite:'noite'}, done = [];
    for(const k of ['manha','tarde','noite']){
      const t = chStr(a[k]); if(!t) continue;
      log[k] = (mode==='adicionar' && chStr(log[k])) ? chStr(log[k])+'\n'+t : t; done.push(lbl[k]);
    }
    if(!done.length) throw new Error('Nenhum texto informado para o diário.');
    log.updatedAt = Date.now(); await dbPut('diaryLogs',log);
    const i = S.diaryLogs.findIndex(d=>d.date===date); if(i>-1) S.diaryLogs[i]=log; else S.diaryLogs.push(log);
    return {ok:true, resumo:`Diário de ${fmtDatePretty(date)} atualizado (${done.join(', ')})`};

  ler_diario: async a=>{

    if(daysBetween(s0,e0)>60) throw new Error('Intervalo máximo de 60 dias.');
    const out = [];
    for(let d=s0; d<=e0; d=addDays(d,1)){ const l=S.diaryLogs.find(x=>x.date===d); if(l&&(l.manha||l.tarde||l.noite)) out.push({data:d,manha:l.manha||'',tarde:l.tarde||'',noite:l.noite||''}); }

  criar_okr: async a=>{
    const objective=chStr(a.objetivo); if(!objective) throw new Error('Informe o objetivo.');
    const startDate=chDate(a.data_inicio), deadline=a.prazo?chDate(a.prazo):null;
    if(deadline&&deadline<startDate) throw new Error('O prazo não pode ser antes do início.');
    const list=Array.isArray(a.resultados_chave)?a.resultados_chave:[]; const t=Date.now(), krs=[];
    list.forEach((k,i)=>{
      const title=chStr(k&&k.titulo); if(!title) return;
      const mode=['check','daily','percent','numeric','weight'].includes(k.tipo)?k.tipo:'check', id=t+i;
      if(mode==='daily'){ if(!deadline) throw new Error('KR diário exige um prazo (data final) no objetivo.'); krs.push({id,title,mode,days:[]}); }
      else if(mode==='check') krs.push({id,title,mode,done:false});
      else if(mode==='percent') krs.push({id,title,mode,current:0});
      else {
        let st=k.inicio; if(mode==='weight'&&!has(k,'inicio')){ const w=latestWeight(); if(w==null) throw new Error('Informe o peso inicial do KR de peso.'); st=w; }
        const start=chNum(st,'Início de "'+title+'"'), target=chNum(k.meta,'Meta de "'+title+'"');
        krs.push({id,title,mode,start,target,unit:mode==='weight'?'kg':chStr(k.unidade),current:mode==='weight'?null:start});
      }
    });
    if(!krs.length) throw new Error('Informe ao menos um resultado-chave com título.');
    const rec={objective,deadline,startDate,keyResults:krs,createdAt:Date.now()}; rec.id=await dbPut('okrs',rec); S.okrs.push(rec);
    return {ok:true,id:rec.id,resumo:`Objetivo criado: ${objective} (${krs.length} resultado(s)-chave)`,resultados_chave:krs.map(k=>({id:k.id,titulo:k.title}))};
  },
  atualizar_resultado_chave: async a=>{
    const o=chFind(S.okrs,a.okr_id,'objetivo'), k=o.keyResults.find(x=>x.id===Number(a.kr_id)); if(!k) throw new Error('Não encontrei o resultado-chave '+a.kr_id+'.');
    const was=okrProgress(o)===100, want=a.feito!==false;
    if(k.mode==='check') k.done=want;
    else if(k.mode==='daily'){
      const day=chDate(a.data), st=krDailyStats(k,o); if(day<st.start||day>st.end) throw new Error('Esse dia está fora do período do objetivo.');
      k.days=k.days||[]; const idx=k.days.indexOf(day); if(want&&idx<0) k.days.push(day); if(!want&&idx>-1) k.days.splice(idx,1);
    }
    else if(k.mode==='weight') throw new Error('Resultado-chave de peso é automático: basta registrar o peso.');
    else { let v=chNum(a.valor,'Valor'); if(k.mode==='percent') v=Math.max(0,Math.min(100,v)); k.current=v; }
    await dbPut('okrs',o); if(!was&&okrProgress(o)===100) celebrateOkr(o);
    return {ok:true,resumo:`Resultado-chave atualizado: ${k.title}`};
  },

async function saveDiary(date){

function exportDiary(){
  const entries = S.diaryLogs.filter(d=>d.manha||d.tarde||d.noite).sort((a,b)=>a.date.localeCompare(b.date));
  if(!entries.length){ toast('Nenhum registro de diário para exportar ainda.'); return; }
  let text = `EVOLVE — Diário exportado em ${fmtDatePretty(todayStr())}\n${'='.repeat(40)}\n\n`;
  entries.forEach(e=>{
    text += `--- ${e.date} ---\n`;
    if(e.manha) text += `Manhã: ${e.manha}\n`;
    if(e.tarde) text += `Tarde: ${e.tarde}\n`;
    if(e.noite) text += `Noite: ${e.noite}\n`;
    text += `\n`;
  });
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `diario-evolve-${todayStr()}.txt`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('Diário exportado.');
}
function diaryRangeFor(date, scope){
  if(scope==='day') return [date];
  if(scope==='week'){ const arr=[]; for(let i=6;i>=0;i--) arr.push(addDays(date,-i)); return arr; }
  // all: from earliest recorded diary/score entry up to date
  const allDates = [...S.diaryLogs.map(d=>d.date), ...S.dailyScores.map(s=>s.date)].filter(d=>d<=date);
  const earliest = allDates.length ? allDates.sort()[0] : date;
  const arr=[]; for(let d=earliest; d<=date; d=addDays(d,1)){ arr.push(d); if(arr.length>120) break; }
  return arr;
}
async function runAnalysis(date, scope){
  if(!S.geminiApiKey){ toast('Configure sua chave do Gemini nos Ajustes.'); return; }
  const btn = document.getElementById('analyzeBtn'); btn.textContent='Analisando...'; btn.disabled=true;
  try{
    const range = diaryRangeFor(date, scope);
    const hasLog = d=>{ const l=S.diaryLogs.find(x=>x.date===d); return l && (l.manha||l.tarde||l.noite); };
    const entries = range.filter(hasLog).map(d=>({date:d, log:S.diaryLogs.find(x=>x.date===d)}));
    // Para um único dia, anexa os 14 dias anteriores como contexto (para enxergar padrões e recorrências)
    let contextEntries = [], contextMetrics = [];
    if(scope==='day'){
      const ctx = []; for(let i=14;i>=1;i--) ctx.push(addDays(date,-i));
      contextEntries = ctx.filter(hasLog).map(d=>({date:d, log:S.diaryLogs.find(x=>x.date===d)}));
      contextMetrics = ctx.map(d=> S.dailyScores.find(x=>x.date===d)).filter(Boolean);
    }
    const metricsRange = range.map(d=> S.dailyScores.find(s=>s.date===d) || computeDayMetrics(d));
    const prompt = buildAnalysisPrompt(date, scope, entries, metricsRange, contextEntries, contextMetrics);
    const result = await callGemini(prompt, ANALYSIS_SYSTEM_INSTRUCTION, ANALYSIS_GENERATION_CONFIG);
    const parsed = parseAnalysisJSON(result);
    const row = {date, scope, data:parsed, raw:result, createdAt:Date.now()};
    const id = await dbPut('aiAnalyses',row); row.id=id;
    S.aiAnalyses = S.aiAnalyses.filter(a=>!(a.date===date && a.scope===scope));
    S.aiAnalyses.push(row);
    document.getElementById('analysisResult').innerHTML = renderAnalysisBlock(row);
    toast('Análise concluída.');
  }catch(e){
    toast('Erro ao conectar com o Gemini: '+(e.message||''));
  }
  btn.textContent='Analisar com IA'; btn.disabled=false;
}
const ANALYSIS_SYSTEM_INSTRUCTION = `Você é o mentor pessoal da pessoa que escreve este diário: um analista de comportamento, emoções e disciplina que leu tudo com atenção e conversa com ela de forma direta, honesta e humana. Você não é um chatbot de bem-estar nem um coach de frases motivacionais. Fale em português do Brasil, em segunda pessoa (você), em tom natural de conversa — firme quando precisa, caloroso sem ser condescendente.

COMO LER O DIÁRIO
Leia o conteúdo, não só a quantidade. Preste atenção em: emoções e o que as provoca, relações com pessoas (família, amigos, solidão, conexão), alimentação e saúde, sono e energia, dinheiro, trabalho, procrastinação, desculpas e justificativas, gatilhos, falas de autocrítica, insights que a própria pessoa teve ("percebi que...") e contradições entre o que ela diz querer e o que faz. Cruze o diário com as métricas diárias (índice de evolução, rotina, hábitos, execução) e com o objetivo principal e as metas da pessoa: se um dia foi ruim nas métricas, procure no texto o que aconteceu; se algo escrito ameaça ou apoia uma meta, diga isso.

IMPACTO IMPORTA MAIS QUE FREQUÊNCIA
Um padrão se vê quando algo se repete. Mas um único registro pode ser decisivo. Se a pessoa anotar uma única vez que, ao ver um filme, percebeu que precisa se conectar com pessoas, isso é um sinal de grande impacto: aborde, explique por que pode mexer com a vida inteira dela e como trabalhar nisso. Faça esse trabalho para qualquer registro único que toque em valores, relações, saúde, identidade, vícios, dinheiro, medos, propósito ou uma decisão importante. Use "sinais" para isso e "padroes" para o que se repete (gatilhos, horários, emoções, desculpas, contradições, melhoras).

CONSELHO E CRÍTICA, SEMPRE
O campo conversaFranca é obrigatório e vem sempre no final. Nele você dá conselhos práticos e também críticas diretas, com respeito, sem humilhar. Nomeie o que está por trás do comportamento quando as anotações sustentarem isso: comer para aliviar angústia, saudade ou ansiedade; adiar para fugir de desconforto; usar uma circunstância como justificativa. Exemplo de tom (não copie, adapte ao caso real): se a pessoa quebrou a dieta no almoço na casa da mãe, algo como "a comida não vai te devolver a sensação de infância na casa da sua mãe nem tirar a sua angústia; foque no seu objetivo, e aqui está o que fazer na próxima vez". Aponte o que ela está se enganando, o que está evitando e o que precisa de decisão, sempre ligando ao objetivo dela.

REGRAS
- Seja específico: cite o que ela escreveu (trechos curtos e literais, com a data) e trate de eventos concretos com ações concretas: remover um gatilho do ambiente, combinar algo antes, trocar um hábito por outro específico, definir uma regra simples e mensurável para a próxima vez.
- NUNCA diga "registre mais dias", "continue registrando" nem apresente a falta de dados como o ponto a melhorar. Com poucos registros, analise a fundo o que existe. Se for essencial, mencione em uma frase que mais dias de registro refinariam os padrões, mas nunca como conteúdo principal de "melhorar".
- NUNCA use frases genéricas como "tenha mais força de vontade", "seja mais disciplinado" ou "continue se esforçando".
- Separe o que está escrito (fatos) do que você interpreta. Interpretações usam linguagem de hipótese ("parece que", "pode ser que"). Não invente fatos, eventos, pessoas ou sentimentos que não estejam nos dados.
- Você não é terapeuta nem médico: não faça diagnósticos. Se houver sinais de sofrimento intenso, trate com cuidado e sugira conversar com um profissional ou alguém de confiança.
- Seja completo: escreva o quanto for preciso para ser útil, em parágrafos corridos. Sem markdown, sem asteriscos, sem listas com hífen, sem títulos, sem emojis. Quebras de parágrafo são permitidas.
- Se uma lista (padroes ou sinais) realmente não tiver nada a registrar, devolva-a vazia em vez de inventar.`;

function analysisContextText(){
  const lines = [];
  const pr = S.profile || {};
  if(pr.conquer) lines.push(`O que quer conquistar: ${pr.conquer}`);
  if(pr.mainGoal) lines.push(`Objetivo principal: ${pr.mainGoal}`);
  if(pr.habit) lines.push(`Hábito que quer desenvolver: ${pr.habit}`);
  const today = todayStr();
  const projs = S.projects.filter(p=>!p.archived && (!p.endDate || p.endDate>=today));
  projs.slice(0,8).forEach(p=>{
    let t = `Meta "${p.name}"`;
    if(p.objective) t += ` — objetivo: ${p.objective}`;
    if(p.startDate && p.endDate) t += ` (de ${p.startDate} a ${p.endDate})`;
    if(p.metricMode && p.metricMode!=='none' && p.metricStart!=null && p.metricTarget!=null){
      const last = (p.metricLogs||[]).slice().sort((x,y)=>x.date.localeCompare(y.date)).pop();
      t += ` · métrica: ${p.metricStart} → ${p.metricTarget} ${p.metricUnit||''}${last?` (última medição: ${last.value} em ${last.date})`:''}`;
    }
    lines.push(t);
  });
